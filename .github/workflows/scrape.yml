name: Scrape internship offers

on:
  schedule:
    # Toutes les 3 heures (UTC). GitHub peut retarder légèrement l'exécution
    # aux heures de forte charge, c'est normal et sans conséquence ici.
    - cron: "0 */3 * * *"
  workflow_dispatch: {} # permet de le lancer manuellement depuis l'onglet Actions

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated offers.json if changed
        run: |
          git config user.name "internship-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add offers.json
          if git diff --cached --quiet; then
            echo "Aucun changement, rien à committer."
          else
            git commit -m "Update offers.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
