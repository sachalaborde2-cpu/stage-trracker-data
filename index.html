// Horodatage de build — affiché dans l'app pour verifier en un coup d'oeil
// si la version chargee est bien la derniere (utile en cas de doute sur un
// cache navigateur ou GitHub Pages qui n'aurait pas propage a temps).
const BUILD_VERSION = "2026-10-22 07:50 UTC";

const LocalStore = {
  get(key) {
    try {
      const v = localStorage.getItem(key);
      return v !== null ? JSON.parse(v) : null;
    } catch (e) { return null; }
  },
  set(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) { return false; }
  },
};

/* ============================================================
   SYNCHRONISATION GITHUB (optionnelle — mêmes candidatures partout)
   Stocke tracker.json à la racine du repo que tu configures.
   Token stocké uniquement dans ton navigateur (localStorage),
   jamais envoyé ailleurs qu'à l'API GitHub officielle.
   ============================================================ */
const GitHubSync = {
  getConfig() {
    return LocalStore.get("settings:github") || { token: "", owner: "", repo: "", path: "tracker.json" };
  },
  setConfig(cfg) {
    LocalStore.set("settings:github", cfg);
  },
  isConfigured(cfg) {
    return !!(cfg && cfg.token && cfg.owner && cfg.repo);
  },
  async pull(cfg, raw, pathOverride) {
    const path = pathOverride || cfg.path;
    const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`;
    const res = await fetch(url, { headers: { Authorization: `Bearer ${cfg.token}`, Accept: "application/vnd.github+json" } });
    if (res.status === 404) return { data: null, sha: null };
    if (!res.ok) throw new Error("GitHub pull: HTTP " + res.status);
    const json = await res.json();
    const decoded = decodeURIComponent(escape(atob(json.content.replace(/\n/g, ""))));
    return { data: raw ? decoded : JSON.parse(decoded), sha: json.sha };
  },
  async push(cfg, data, sha, raw, pathOverride) {
    const path = pathOverride || cfg.path;
    const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`;
    const payload = raw ? data : JSON.stringify(data, null, 2);
    const content = btoa(unescape(encodeURIComponent(payload)));
    const body = { message: `Update ${path} (` + new Date().toISOString() + ")", content };
    if (sha) body.sha = sha;
    const res = await fetch(url, {
      method: "PUT",
      headers: { Authorization: `Bearer ${cfg.token}`, Accept: "application/vnd.github+json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const errText = await res.text().catch(() => "");
      throw new Error("GitHub push: HTTP " + res.status + " " + errText.slice(0, 200));
    }
    const json = await res.json();
    return json.content.sha;
  },
};

// Parsing robuste des reponses JSON de Gemini — utilise partout ou l'IA
// doit renvoyer du JSON (5 endroits dans l'app). Gemini respecte presque
// toujours le format demande, mais glisse parfois un backslash litteral
// invalide pour JSON (ex: en recopiant un bout de texte source), ce qui
// faisait planter le parsing avec une erreur brute et peu comprehensible
// ("Bad escaped character..."). Trois niveaux de recuperation avant
// d'abandonner :
function parseAiJson(text) {
  if (!text) throw new Error("Réponse Gemini vide ou inattendue.");
  try {
    return JSON.parse(text);
  } catch (e1) {
    // Niveau 2 : retire d'eventuelles balises markdown ```json ... ```
    const clean = text.replace(/^```json/i, "").replace(/^```/, "").replace(/```$/, "").trim();
    try {
      return JSON.parse(clean);
    } catch (e2) {
      // Niveau 3 : repare les backslash invalides pour JSON (tout \ non
      // suivi d'un caractere d'echappement valide devient \\, ce qui le
      // transforme en backslash litteral au lieu de faire planter le parse).
      const repaired = clean.replace(/\\(?!["\\/bfnrtu])/g, "\\\\");
      try {
        return JSON.parse(repaired);
      } catch (e3) {
        throw new Error("Réponse de l'IA illisible (JSON invalide) — réessaie, ça arrive occasionnellement.");
      }
    }
  }
}

function escapeLatex(str) {
  if (!str) return str;
  // Defense en profondeur : neutralise en texte brut tout formatage
  // markdown ou commande LaTeX que l'IA glisserait par erreur dans un
  // texte cense etre brut (bug reel constate le 31/08 — "\textbf{...}"
  // et "**...**" se retrouvaient affiches litteralement et casses dans
  // le PDF final, ex: "\{}textbf{1st out of 12 participants}"). Sans
  // cette etape, l'echappement ci-dessous transforme un \ ou un {
  // legitime-en-apparence en charabia au lieu de le neutraliser proprement.
  const cleaned = str
    .replace(/\\textbf\{([^}]*)\}/g, "$1")
    .replace(/\\textit\{([^}]*)\}/g, "$1")
    .replace(/\\emph\{([^}]*)\}/g, "$1")
    .replace(/\*\*([^*]+)\*\*/g, "$1")
    .replace(/__([^_]+)__/g, "$1")
    .replace(/\\([%&$#_{}])/g, "$1"); // neutralise un echappement LaTeX deja present (evite le double-echappement juste apres)
  return cleaned.replace(/\\/g, "\\textbackslash{}").replace(/&/g, "\\&").replace(/%/g, "\\%")
    .replace(/\$/g, "\\$").replace(/#/g, "\\#").replace(/_/g, "\\_")
    .replace(/\{/g, "\\{").replace(/\}/g, "\\}")
    .replace(/~/g, "\\textasciitilde{}").replace(/\^/g, "\\textasciicircum{}");
}
function articleFor(word) {
  if (!word) return "a";
  const w = word.trim();
  const first = w.split(/\s+/)[0];
  // Sigle en majuscules (FX, MBA, SQL, HR...) : l'article suit le NOM de la
  // premiere lettre ("an FX", "an HR", mais "a CIB"). Constate le 21/10 : "a FX Risk...".
  if (/^[A-Z&]{2,6}$/.test(first)) return /^[AEFHILMNORSX]/.test(first) ? "an" : "a";
  if (/^(uni|use|usu|eu|one|ubi)/i.test(w)) return "a"; // "a University...", "a European..."
  if (/^(hour|honest|honor)/i.test(w)) return "an";
  return /^[aeiouAEIOU]/.test(w) ? "an" : "a";
}
// Abrege un intitule de poste en initiales (ex: "Derivatives Back Office
// Analyst Intern" -> "DBOAI"), pour distinguer deux candidatures a la meme
// entreprise dans le nom de fichier. Ignore les mots de liaison courants.
function jobTitleAbbrev(jobTitle) {
  if (!jobTitle) return "";
  const stopWords = new Set(["a", "an", "the", "of", "and", "for", "in", "at", "to", "&"]);
  const initials = jobTitle
    .split(/[\s\/\-]+/)
    .filter(Boolean)
    .filter(w => !stopWords.has(w.toLowerCase()))
    .map(w => w[0].toUpperCase())
    .join("");
  return initials.slice(0, 6);
}

/* ============================================================
   AUDIT — boucle d'amélioration continue du moteur d'adaptation.
   Chaque candidature enregistre l'offre, la sortie brute de Gemini et la
   version finale (après tes retouches). Le "dossier d'audit" regroupe tout
   dans un fichier que tu m'envoies : j'analyse, puis je corrige le prompt.
   ============================================================ */
function texToPlain(tex) {
  if (!tex) return "";
  let t = tex.split("\\begin{document}")[1] || tex;
  t = t.split("\\end{document}")[0];
  t = t.replace(/%.*$/gm, "");
  t = t.replace(/\\(vspace|hspace)\*?\{[^}]*\}/g, "");
  t = t.replace(/\\(noindent|par|flushbottom|raggedbottom|centering|hfill|newline)\b/g, "");
  t = t.replace(/\\\\(\[[^\]]*\])?/g, "\n");
  t = t.replace(/\\(begin|end)\{[^}]*\}(\[[^\]]*\])?/g, "");
  for (let i = 0; i < 4; i++) t = t.replace(/\\[a-zA-Z]+\*?(\[[^\]]*\])?\{([^{}]*)\}/g, "$2");
  t = t.replace(/\\&/g, "&").replace(/\\%/g, "%").replace(/\\_/g, "_").replace(/\\\$/g, "$");
  return t.replace(/\n{3,}/g, "\n\n").trim();
}

function auditEligible(app) {

function adaptationDiff(raw, final) {

  if ((raw.headlineFill || "") !== (final.headlineFill || "")) out.push("headlineFill");

  new Set([...Object.keys(rl), ...Object.keys(fl)]).forEach(k => { if ((rl[k] || "") !== (fl[k] || "")) out.push("letterFields." + k); });
  if (JSON.stringify(raw.keywordChanges || []) !== JSON.stringify(final.keywordChanges || [])) out.push("keywordChanges");

}

/* ============================================================
   COMPILATION PDF DIRECTE avec garantie 1 page
   Utilise l'API publique latex-on-http (latex.ytotech.com).
   Même logique de resserrage automatique (marges + interligne)
   que celle validée précédemment, transposée en JS.
   ============================================================ */
const CV_PDF_FALLBACKS = [
  // Niveaux 0-2 : marges de Sacha (0.5in/0.6in) JAMAIS touchees — seul
  // l'espacement interne (interligne + espace entre puces) se resserre.
  // C'est la cause reelle du souci observe le 26/08 : un contenu legerement
  // plus long (mots-cles adaptes) faisait sauter direct sur des marges
  // reduites, cassant la coherence visuelle entre candidatures.
  { top: "0.5in", bottom: "0.5in", left: "0.6in", right: "0.6in", stretch: "1.0",  itemsep: "1.5pt", topsep: "1.5pt" },
  { top: "0.5in", bottom: "0.5in", left: "0.6in", right: "0.6in", stretch: "0.96", itemsep: "0.8pt", topsep: "0.8pt" },
  { top: "0.5in", bottom: "0.5in", left: "0.6in", right: "0.6in", stretch: "0.92", itemsep: "0pt",   topsep: "0pt"   },
  // Niveaux 3-4 : dernier recours seulement, si resserrer l'espacement ne
  // suffit vraiment pas — la, les marges bougent.
  { top: "0.35in", bottom: "0.35in", left: "0.5in", right: "0.5in", stretch: "0.94", itemsep: "0pt", topsep: "0pt" },
  { top: "0.2in", bottom: "0.2in", left: "0.35in", right: "0.35in", stretch: "0.90", itemsep: "0pt", topsep: "0pt" },
];
const LM_PDF_FALLBACKS = [
  { top: "1in", bottom: "1in", left: "1in", right: "1in", stretch: "1.1" },
  { top: "0.9in", bottom: "0.9in", left: "0.9in", right: "0.9in", stretch: "1.05" },
  { top: "0.8in", bottom: "0.8in", left: "0.8in", right: "0.8in", stretch: "1.0" },
  { top: "0.7in", bottom: "0.7in", left: "0.7in", right: "0.7in", stretch: "0.95" },
];

function applyPdfGeometry(tex, docType, level) {
  const fb = (docType === "cv" ? CV_PDF_FALLBACKS : LM_PDF_FALLBACKS)[level];
  let out = tex.replace(/\\usepackage\[top=[^\]]*\]\{geometry\}/,
    `\\usepackage[top=${fb.top}, bottom=${fb.bottom}, left=${fb.left}, right=${fb.right}]{geometry}`);
  if (docType === "cv") {
    if (out.includes("\\renewcommand{\\baselinestretch}")) {
      out = out.replace(/\\renewcommand\{\\baselinestretch\}\{[^}]*\}/, `\\renewcommand{\\baselinestretch}{${fb.stretch}}`);
    } else {
      out = out.replace("\\pagestyle{empty}", `\\renewcommand{\\baselinestretch}{${fb.stretch}}\n\\pagestyle{empty}`);
    }
    // Resserre l'espacement des puces AVANT de toucher aux marges (voir
    // les niveaux 0-2 de CV_PDF_FALLBACKS) — c'est ce qui permet d'absorber
    // un leger depassement sans jamais changer les marges de Sacha.
    if (fb.itemsep !== undefined) {
      out = out.replace(
        /\\setlist\[itemize\]\{[^}]*\}/,
        `\\setlist[itemize]{leftmargin=0.5cm, itemsep=${fb.itemsep}, parsep=0pt, topsep=${fb.topsep}, partopsep=0pt}`
      );
    }
  } else {
    out = out.replace(/\\setstretch\{[^}]*\}/, `\\setstretch{${fb.stretch}}`);
  }
  return out;
}

async function compileViaApi(tex) {
  const res = await fetch("https://latex.ytotech.com/builds/sync", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ compiler: "pdflatex", resources: [{ main: true, content: tex }] }),
  });
  if (!res.ok) {
    let msg = "Erreur de compilation (HTTP " + res.status + ")";
    try {
      const errJson = await res.json();
      if (errJson && errJson.logs) msg += " : " + String(errJson.logs).slice(-400);
    } catch (e) {}
    throw new Error(msg);
  }
  return await res.arrayBuffer();
}

async function countPdfPagesFromBuffer(arrayBuffer) {
  const doc = await PDFLib.PDFDocument.load(arrayBuffer);
  return doc.getPageCount();
}

async function compileWithOnePageGuarantee(tex, docType, onProgress) {
  const fallbacks = docType === "cv" ? CV_PDF_FALLBACKS : LM_PDF_FALLBACKS;
  for (let level = 0; level < fallbacks.length; level++) {
    if (onProgress) onProgress(level, fallbacks.length);
    const attemptTex = applyPdfGeometry(tex, docType, level);
    const pdfBytes = await compileViaApi(attemptTex);
    const pages = await countPdfPagesFromBuffer(pdfBytes);
    if (pages === 1) return pdfBytes;
  }
  throw new Error("Le contenu dépasse 1 page même au resserrement maximal — raccourcis un mot-clé ou un champ de la lettre puis réessaie.");
}

  const stored = LocalStore.get("cvMaster:" + contractType);
  return stored || getDefaultFilledCv(contractType);
}
async function saveMasterCv(contractType, tex) {
  LocalStore.set("cvMaster:" + contractType, tex);
  const cfg = GitHubSync.getConfig();
  if (GitHubSync.isConfigured(cfg)) {
    const fileCfg = { ...cfg, path: `cv_master_${contractType}.tex` };
    const shaKey = "cvMasterSha:" + contractType;
    let sha = LocalStore.get(shaKey);
    try {
      if (!sha) {
        const pulled = await GitHubSync.pull(fileCfg, true);
        sha = pulled.sha;
      }
      const newSha = await GitHubSync.push(fileCfg, tex, sha, true);
      LocalStore.set(shaKey, newSha);
      return { ok: true };
    } catch (e) {
      return { ok: false, error: e.message };
    }
  }
  return { ok: true, localOnly: true };
}

function buildCvTex(contractType, headlineFill, keywordChanges, programType, programYear, durationMonths) {
  const ct = CONTRACT_TYPES[contractType];
  if (!ct || !ct.ready) return null;
  const year = escapeLatex(programYear || "2027");
  const fill = escapeLatex(headlineFill || "Front Office");
  const duration = escapeLatex(String(durationMonths || 6));
  let sentence;
  if (contractType === "stage") {
    sentence = programType === "summer"
      ? `Analytics and Sales Intern at FactSet, seeking a Summer ${fill} internship in ${year}.`
      : `Analytics and Sales Intern at FactSet, seeking a ${duration}-month ${fill} internship starting January ${year}.`;
  } else {
    sentence = `Analytics and Sales Intern at FactSet, seeking a ${fill} position.`;
  }
  let tex = getMasterCv(contractType).replace("__HEADLINE_SENTENCE__", sentence);
  // Seuls les bullets explicitement designes comme modifiables (ct.editableBullets)
  // peuvent etre substitues — sans cette liste blanche, un "old" propose par
  // l'IA qui correspond par hasard a un AUTRE passage du CV (ex: un bullet
  // Education non destine a etre touche) serait quand meme remplace, ce qui
  // s'est reellement produit (bug confirme le 19/08).
  const allowedOldTexts = new Set(Object.values(ct.editableBullets || {}));
  (keywordChanges || []).forEach(({ old: oldTxt, new: newTxt }) => {
    if (!oldTxt || !newTxt) return;
    if (!allowedOldTexts.has(oldTxt)) return; // hors des emplacements autorises : ignore
    if (!tex.includes(oldTxt)) return;
    let newTex = escapeLatex(newTxt);
    // Retablit le gras de l'original quand le groupe de mots en gras est
    // conserve tel quel dans la reformulation (ex: "1st out of 12 participants",
    // "+6% return"). Sans ca, le chiffre cle de la simulation perdait son gras
    // et le recruteur ne le voyait plus en lecture rapide.
    const boldRe = /\\textbf\{([^{}]*)\}/g;
    let bm;
    while ((bm = boldRe.exec(oldTxt)) !== null) {
      const plain = bm[1].replace(/\\([%&$#_])/g, "$1");
      if (!plain) continue;
      const esc = escapeLatex(plain);
      if (newTex.includes(esc) && !newTex.includes("\\textbf{" + esc + "}")) newTex = newTex.replace(esc, "\\textbf{" + esc + "}");
    }
    tex = tex.replace(oldTxt, () => newTex);
  });
  return tex;
}

function buildLmTex(contractType, fields, programType, programYear, durationMonths) {
  const ct = CONTRACT_TYPES[contractType];
  if (!ct || !ct.ready) return null;
  const f = fields || {};
  const rawJobTitle = f.jobTitle || "[Job Title]";
  const year = escapeLatex(programYear || "2027");
  const duration = escapeLatex(String(durationMonths || 6));
  const article = articleFor(rawJobTitle);
  const jobTitle = escapeLatex(rawJobTitle);
  const company = escapeLatex(f.company || "[Company Name]");
  const team = escapeLatex(f.team || "your team");

  const variant = ct.programVariants ? (ct.programVariants[programType] || Object.values(ct.programVariants)[0]) : null;
  let para1 = variant ? variant.para1 : String.raw`\noindent Joining __COMPANY__ as __ARTICLE__ __JOBTITLE__ represents the ideal opportunity for me to combine my academic rigor with my appetite for this role, within __TEAM__.`;
  para1 = para1.split("__COMPANY__").join(company).split("__ARTICLE__").join(article)
    .split("__JOBTITLE__").join(jobTitle).split("__YEAR__").join(year).split("__TEAM__").join(team)
    .split("__DURATION__").join(duration);

  const hook = (f.offerHook || "").trim().replace(/[.\s]+$/, "");
  const hookSentence = hook ? "What draws me to this role is " + escapeLatex(hook) + ". " : "";

  return ct.lmTemplate
    .split("__PARA1__").join(para1)
    .split("__COMPANY__").join(company)
    .split("__ARTICLE__").join(article)
    .split("__JOBTITLE__").join(jobTitle)
    .split("__HOOKSENTENCE__").join(hookSentence)
    .split("__TASK1__").join(escapeLatex(f.task1) || "[Task 1]")
    .split("__TASK2__").join(escapeLatex(f.task2) || "[Task 2]")
    .split("__TASK3__").join(escapeLatex(f.task3) || "[Task 3]")
    .split("__PROOFS__").join(buildProofsText(f.proofPoints))
    .split("__CLOSINGAMBITION__").join(escapeLatex(f.closingAmbition) || "[Closing Ambition]")
    .split("__TEAM__").join(team);
}

/* ============================================================
   APPEL IA — Gemini (ta clé, stockée en local uniquement)
   ============================================================ */
/* Garde-fou : ecarte une reformulation de bullet quand elle degrade le CV
   aux yeux d'un recruteur. Constate sur 4 candidatures reelles (audit du
   21/10) : clauses collees en fin de bullet pour caler un mot-cle de l'offre
   ("utilizing programming tools for internal systems", "demonstrating strong
   commercial drive"), activites inventees, bullets raccourcis sans leurs
   metriques (IRR, Alpha, volatility), changement de temps verbal.
   Un bullet ecarte reste tel qu'il est dans le CV maitre. */
function plainBullet(t) {
  return (t || "").replace(/\\textbf\{([^{}]*)\}/g, "$1").replace(/\\([%&$#_{}])/g, "$1");
}
const GUARD_FILLER = /\b(demonstrating|utili[sz]ing|leverag(?:e|es|ing)|enhanc(?:e|es|ing)|aligning with|aligned with|contributing to|robust|with (?:a )?focus on|within market finance|commercial drive)\b/i;
const IRREGULAR_PAST = new Set(["built", "ran", "led", "wrote", "made", "took", "won", "set", "drove", "grew"]);
function verbIsPast(w) { const l = (w || "").toLowerCase(); return /ed$/.test(l) || IRREGULAR_PAST.has(l); }
function guardKeywordChanges(changes) {
  const kept = [], rejected = [];
  (changes || []).forEach(c => {
    if (!c || !c.old || !c.new) return;
    const o = plainBullet(c.old), n = plainBullet(c.new);
    const ow = o.split(/\s+/).filter(Boolean), nw = n.split(/\s+/).filter(Boolean);
    let reason = "";
    const ratio = nw.length / Math.max(1, ow.length);
    if (ratio > 1.12) reason = "trop long (+" + Math.round((ratio - 1) * 100) + "%), clause ajoutée";
    else if (ratio < 0.85) reason = "raccourci de " + Math.round((1 - ratio) * 100) + "%, contenu perdu";
    if (!reason && GUARD_FILLER.test(n) && !GUARD_FILLER.test(o)) reason = "formule de remplissage (" + (n.match(GUARD_FILLER) || [""])[0] + ")";
    if (!reason) {
      const nums = o.match(/\d[\d,.]*\d|\d/g) || [];
      const missing = nums.filter(x => !n.includes(x));
      if (missing.length) reason = "chiffre supprimé (" + missing.join(", ") + ")";
    }
    if (!reason) {
      const names = (ow.slice(1).join(" ").match(/\b[A-Z][A-Za-z0-9]{2,}\b/g) || []);
      const lostNames = names.filter(x => !n.includes(x));
      if (lostNames.length) reason = "élément concret supprimé (" + [...new Set(lostNames)].slice(0, 3).join(", ") + ")";
    }
    if (!reason && ow[0] && nw[0] && verbIsPast(ow[0]) !== verbIsPast(nw[0])) reason = "temps verbal changé (" + ow[0] + " → " + nw[0] + ")";
    if (!reason) {
      const cnt = (arr, w) => arr.filter(x => x.toLowerCase().replace(/[^a-z]/g, "") === w).length;
      const rep = nw.map(x => x.toLowerCase().replace(/[^a-z]/g, "")).filter(x => x.length >= 6).find(x => cnt(nw, x) >= 2 && cnt(nw, x) > cnt(ow, x));
      if (rep) reason = "mot répété (" + rep + ")";
    }
    if (reason) rejected.push({ old: c.old, new: c.new, reason });
    else kept.push(c);
  });
  return { kept, rejected };
}

async function generateAdaptation(offerText, company, jobTitle, location, contractType, programType, programYear, geminiSettings) {
  const ct = CONTRACT_TYPES[contractType];
  const masterCv = getMasterCv(contractType);
  // Seuls les 4 bullets modifiables sont proposes a Gemini. Avant, tous les
  // bullets du CV lui etaient montres : il en reformulait d'autres (projets,
  // education) que buildCvTex ignorait ensuite, ce qui faussait l'apercu.
  const bulletMatches = Object.values(ct.editableBullets || {}).filter(b => masterCv.includes(b));
  const bulletsList = bulletMatches.map((b, i) => `${i + 1}. "${b}"`).join("\n");
  const year = programYear || "2027";
  const programLine = contractType === "stage"
    ? (programType === "summer"
        ? `Sacha postule à un SUMMER INTERNSHIP (~10 semaines, été ${year}), PAS son stage de césure P2. Ne mentionne jamais "6-month" ni "January".`
        : `Sacha postule à son DEUXIÈME stage de césure (P2), 6 mois, à partir de janvier ${year}.`)
    : `Sacha postule à un poste de type ${ct.label}.`;

  const system = `Tu adaptes une candidature de Sacha Laborde (étudiant M1 Finance, Paris 1 Panthéon-Sorbonne). Son objectif de carrière final est un poste front office (Sales/Trading/Structuring) à Paris, Londres, ou aux USA — mais il postule aussi à des postes middle/back office (Operations, Risk, Compliance...) comme tremplin vers cet objectif, donc CHAQUE candidature doit être adaptée au type de poste réellement visé par CETTE offre, jamais supposer que c'est du front office par défaut.

${programLine}

RÈGLES STRICTES :
1. Ne JAMAIS inventer de faits, dates, chiffres ou expériences.
2. "headlineFill": 2-6 mots MAXIMUM, groupe nominal sans verbe, sans durée ni date. Doit se lire naturellement dans la phrase "seeking a 6-month ___ internship" — donc le nom du désk/métier/fonction visé tel qu'un anglophone l'écrirait, adapté à CE type de poste précis (front office comme "Sales \& Trading" ou "Equity Derivatives Structuring", MAIS AUSSI middle/back office comme "Derivatives Back Office", "Operations", "Risk Management", "Compliance" — ne jamais supposer que c'est du front office par défaut, adapte-toi strictement à l'offre fournie).
3. "keywordChanges" — OBJECTIF : un CV crédible pour un RECRUTEUR HUMAIN d'abord, compatible avec les filtres ATS ensuite. Tu proposes un changement UNIQUEMENT quand un terme exact de l'offre désigne la même chose que ce que Sacha a réellement fait (ex : l'offre dit "portfolio analytics" et le bullet dit "portfolio analysis" : tu peux échanger). Règles :
   - Tu n'es PAS obligé de modifier les 4 bullets : de 0 à 4. Un bullet laissé intact vaut mieux qu'un bullet étiré pour caser un mot-clé.
   - Remplacement de VOCABULAIRE uniquement. Interdit d'ajouter une activité, un but, un résultat, un outil ou une qualité absents de l'original. Interdit d'ajouter une proposition ou un membre de phrase en fin de bullet pour caser un mot-clé (exemples interdits, constatés sur de vraies candidatures : ", utilizing programming tools for internal systems", ", demonstrating strong commercial drive", ", contributing to client onboarding", "aligning with FX option strategies", "leveraging AI tools to optimize workflows"). Ne recopie pas les formules de l'offre ("stakeholders", "project deadlines", "internal systems") si elles ne décrivent pas exactement ce que Sacha a fait.
   - Ne remplace JAMAIS un terme précis par un terme plus vague ("options" → "derivative instruments" est interdit ; "buy-side and sell-side professionals" → "stakeholders" est interdit).
   - Conserve intacts : les chiffres, les noms d'outils, de données et de certifications (IRR, Alpha, volatility, Bloomberg, FRM, GARP, Yahoo Finance, pytest, Streamlit, FactSet...), le temps verbal du bullet (le poste FactSet est au présent, le reste au passé), et les groupes de mots qui étaient en gras dans l'original (le gras est rétabli automatiquement si le groupe est conservé tel quel).
   - Longueur : même nombre de mots, à ±10 %. Ne répète pas deux fois le même mot dans un bullet.
   - Mots interdits (sauf s'ils sont déjà dans l'original) : demonstrating, utilizing, leveraging, enhancing, aligning with, contributing to, robust, strong, "within market finance", "with focus on".
   - "old" = copie EXACTE et COMPLÈTE d'un des bullets fournis ci-dessous (y compris un éventuel \textbf{...}). "new" = DU TEXTE BRUT UNIQUEMENT, sans \textbf{}, \textit{}, **gras** ni aucun balisage.
   - Un contrôle automatique vérifie ensuite tes sorties et écarte celles qui violent ces règles : inutile de forcer.
4. "letterFields" : la lettre est un gabarit fixe dont Gemini ne remplit que ces champs. Valeurs COURTES, en anglais naturel, grammaire irréprochable. Le gabarit lit :
   "I am applying to join {company} as {a/an} {jobTitle}, within {team}, ... What draws me to this role is {offerHook}. The role covers {task1}, {task2} and {task3}. ... {proofPoints} ... {closingAmbition} Thank you for your attention..."
   - company : nom de l'entreprise tel quel. jobTitle : intitulé du poste en anglais naturel.
   - team : complète "...within ___." — grammaticalement autonome, adapté au type d'employeur. DOIT commencer par "your" (jamais "our"), ex "your Foreign Exchange Sales team", "your Global Markets department". Jamais un nom d'équipe laissé en français : traduis-le.
   - offerHook : complète "What draws me to this role is ___." Un groupe nominal qui commence par "the" (8 à 20 mots) et nomme ce qui, DANS CETTE OFFRE, croise réellement le parcours de Sacha (clients institutionnels, produits dérivés, analyse de risque, outils Python/VBA, environnement marchés...), ex "the combination of client follow-up and FX hedging solutions for corporates". Tire-le UNIQUEMENT du texte de l'offre. N'affirme RIEN sur l'entreprise que l'offre ne dit pas (ni classement, ni culture, ni réputation, ni chiffres). Pas d'adjectifs flatteurs (prestigious, leading, exciting, dynamic). Ne répète pas task1/2/3.
   - task1, task2, task3 : complètent "The role covers ___, ___ and ___." Trois groupes nominaux parallèles, 2 à 6 mots, en minuscules, sans verbe conjugué, tirés des missions réelles de l'offre et sans se répéter. Évite d'empiler plus de 2 noms sans article ou préposition. BON : "existing client portfolios", "new client onboarding", "market risk indicators", "client presentations". MAUVAIS : "Monitor markets" (verbe + majuscule), "production quality controls implementation" (4 noms empilés).
   - proofPoints : tableau d'EXACTEMENT 2 identifiants DISTINCTS, choisis parmi cette liste (les 2 réalisations réelles de Sacha les plus pertinentes pour CETTE offre). Tu ne rédiges rien : le texte est fixe. pricing = moteur de pricing d'options + simulateur de market making ; simulation = 1er sur 12 à la simulation de gestion de portefeuille FactSet (+6%) ; backtest = backtest Golden Cross sur 3 zones ; pipeline = pipeline de données de marché (pandas, pytest) ; econometrics = analyse économétrique à effets fixes sous R ; business = entreprise d'arbitrage et revente (1 200+ transactions, comptabilité complète). Guide : sales, trading, structuration, produits dérivés → pricing + simulation ; risque de marché → backtest + econometrics (ou pipeline) ; opérations, IT, data → pipeline + business ; marketing produit ou clientèle → business ou pricing + simulation.
   - closingAmbition : 1 à 2 phrases COMPLÈTES, en anglais naturel, qui concluent la lettre en reliant cette offre à l'objectif final de Sacha (Sales, Trading ou Structuration). Écris une formulation ORIGINALE à chaque candidature : ne recopie pas les exemples, ils ne montrent que l'intention. Interdits : "perfectly aligns with the continuity of my training" (calque du français), "essential", "convinced", "operational rigor", "ideal". Deux cas :
     * Offre front office (Sales, Trading, Structuring...) : directe et simple. Nomme la fonction de CETTE offre (une offre de trading : "Trading" ; une offre de vente : "Sales" ; une offre de structuration : "Structuring") plutôt que toujours "Sales and Trading". Intention : "I want to build my career in Trading, and this internship is a direct step toward it."
     * Offre back/middle office, risque, marketing, opérations, IT : ne dis JAMAIS que Sacha veut faire CE métier sa profession (ce serait faux). Présente-le comme un tremplin et cite ce que CE poste lui apporterait concrètement, tiré de l'offre. Intention : "My long-term goal is a career in Sales and Trading. This role would give me hands-on knowledge of market risk indicators that I would bring to a front-office desk."
     2 phrases maximum.
5. TOUS les champs (headlineFill, jobTitle, team, offerHook, task1/2/3, closingAmbition) doivent être en ANGLAIS CORRECT ET NATUREL, MÊME SI l'offre fournie est en français. Ne traduis JAMAIS mot à mot ni ne conserve l'ordre des mots français plaqué sur de l'anglais. Exemple concret : si l'offre dit "Assistant Sales Equity Derivatives" (ordre français), le jobTitle correct en anglais est "Equity Derivatives Sales Assistant" (qualificatifs avant le nom, comme un anglophone l'écrirait). Le nom de l'entreprise (company) reste tel quel, jamais traduit. AUCUN de ces champs ne doit contenir de balisage (\textbf{}, **gras**, etc.) — texte brut uniquement, dans tous les cas.
6. Réponds UNIQUEMENT en JSON valide, sans texte avant/après, sans balises markdown :
{"headlineFill":"...","keywordChanges":[{"old":"...","new":"..."}],"letterFields":{"company":"...","jobTitle":"...","team":"...","offerHook":"...","task1":"...","task2":"...","task3":"...","proofPoints":["...","..."],"closingAmbition":"..."}}`;

  const user = `Entreprise : ${company}\nPoste : ${jobTitle}\nVille : ${location}\n\nBullets du CV disponibles pour reformulation (choisis "old" EXACTEMENT parmi ces textes) :\n${bulletsList}\n\nTexte de l'offre :\n${offerText}`;

  const model = (geminiSettings && geminiSettings.model) || "gemini-2.5-flash";
  const apiKey = geminiSettings && geminiSettings.apiKey;
  if (!apiKey) throw new Error("Aucune clé API Gemini configurée — va dans l'onglet Réglages.");

  const response = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: system }] },
        contents: [{ role: "user", parts: [{ text: user }] }],
        generationConfig: { responseMimeType: "application/json" },
      }),
    }
  );
  if (!response.ok) {
    const errText = await response.text().catch(() => "");
    throw new Error(`Erreur API Gemini (${response.status}): ${errText.slice(0, 200)}`);
  }
  const data = await response.json();
  const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
  const parsed = parseAiJson(text);
  const g = guardKeywordChanges(parsed.keywordChanges);
  parsed.keywordChanges = g.kept;
  if (g.rejected.length) parsed.guardrailRejected = g.rejected;
  return parsed;
}

/* ============================================================
   ASSISTANT DE MISE À JOUR DU CV — propose un ajout ou un remplacement,
   avec un ancrage EXACT dans le CV actuel (même principe fiable que les
   mots-clés du moteur d'adaptation), pour permettre une application
   automatique fiable plutôt qu'un simple copier-coller.
   ============================================================ */
async function proposeCvAddition(currentCv, description, mode, targetBullet, geminiSettings, previousProposal, feedback) {
  const modeInstructions = mode === "replace"
    ? `MODE: REMPLACEMENT. Sacha veut remplacer ce bullet exact du CV :\n"${targetBullet}"\n\nPropose un texte de remplacement qui intègre la nouvelle information, dans le même style et une longueur très similaire (+/- 15% de mots). Réponds avec :\n{"mode":"replace","target":"<copie EXACTE du bullet ci-dessus, caractère pour caractère>","replacement":"<nouveau texte>","note":"..."}`
    : `MODE: AJOUT. Sacha veut ajouter une nouvelle information (nouvelle expérience, nouveau projet, ou nouvelle ligne dans une expérience existante), sans rien supprimer.
Tu dois choisir un point d'ancrage : une portion de texte qui existe déjà, MOT POUR MOT, dans le CV fourni, juste avant l'endroit où le nouveau contenu doit être inséré (par exemple la dernière ligne \\end{itemize} d'une section, ou le dernier \\item d'un bloc). Réponds avec :
{"mode":"add","section":"...","insertAfter":"<extrait EXACT et VERBATIM du CV actuel, copié caractère pour caractère>","snippet":"<nouveau contenu LaTeX à insérer juste après insertAfter>","note":"..."}`;

  const system = `Tu aides Sacha Laborde à faire évoluer son CV LaTeX (finance, front office). Le CV est entièrement en anglais.

RÈGLES STRICTES :
1. Reproduis EXACTEMENT le style LaTeX déjà utilisé (mêmes commandes, \\textbf, \\textit, \\hfill, \\item...). Ne réinvente pas de mise en forme.
2. Ne modifie et n'invente RIEN d'autre que ce qui est décrit — reste factuel, pas d'exagération.
3. Si c'est une nouvelle expérience/projet complet, propose un bloc complet au format d'un bloc existant du CV (\\noindent \\textbf{Nom} \\hfill \\textbf{Lieu} \\\\ \\textit{Titre} \\hfill \\textit{Dates} suivi de \\begin{itemize}...\\end{itemize}).
4. Même si la description de Sacha ci-dessous est en français, le texte que tu ajoutes au CV doit être en ANGLAIS CORRECT ET NATUREL — jamais une traduction mot à mot ni l'ordre des mots français plaqué sur de l'anglais (ex: pas "Assistant Sales" mais "Sales Assistant"). Les noms propres (entreprises, lieux) restent tels quels.
5. ÉCHAPPE CORRECTEMENT tout caractère spécial LaTeX dans le texte que tu écris : % devient \\%, & devient \\&, $ devient \\$, # devient \\#. C'est CRITIQUE pour le %% en particulier — un % non échappé ne provoque PAS d'erreur de compilation, il tronque SILENCIEUSEMENT tout le reste de la ligne sans que Sacha s'en aperçoive (ex: "50% growth" doit s'écrire "50\\% growth", sinon "growth" et tout ce qui suit disparaît du PDF sans avertissement).
6. ${modeInstructions}
7. Réponds UNIQUEMENT en JSON valide, sans texte avant/après, sans balise markdown.`;

  let user = `CV LaTeX actuel :\n${currentCv}\n\nCe que Sacha veut faire :\n${description}`;
  if (previousProposal && feedback) {
    user += `\n\nUne première proposition avait été faite :\n${JSON.stringify(previousProposal)}\n\nSacha n'en est pas satisfait et précise :\n${feedback}\n\nPropose une nouvelle version qui tient compte de cette remarque.`;
  }

  const model = (geminiSettings && geminiSettings.model) || "gemini-2.5-flash";
  const apiKey = geminiSettings && geminiSettings.apiKey;
  if (!apiKey) throw new Error("Aucune clé API Gemini configurée — va dans l'onglet Réglages.");

  const response = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: system }] },
        contents: [{ role: "user", parts: [{ text: user }] }],
        generationConfig: { responseMimeType: "application/json" },
      }),
    }
  );
  if (!response.ok) {
    const errText = await response.text().catch(() => "");
    throw new Error(`Erreur API Gemini (${response.status}): ${errText.slice(0, 200)}`);
  }
  const data = await response.json();
  const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
  const proposal = parseAiJson(text);
  // Vérification cliente : l'ancrage doit exister EXACTEMENT dans le CV,
  // sinon l'application automatique serait impossible/dangereuse.
  const anchor = proposal.mode === "replace" ? proposal.target : proposal.insertAfter;
  proposal._anchorFound = !!(anchor && currentCv.includes(anchor));
  return proposal;
}

// Extrait tous les \item ... d'un CV LaTeX, pour construire le menu de
// sélection "quel bullet remplacer" (texte exact, garanti présent).
function extractCvBullets(cvText) {
  const matches = [...cvText.matchAll(/\\item\s+([^\n]+?)(?=\n\s*(?:\\item|\\end\{itemize\}))/g)];
  return matches.map(m => m[1].trim()).filter(Boolean);
}

// Filet de securite : detecte les caracteres speciaux LaTeX non echappes
// dans un texte que l'IA vient de proposer (assistant "Mon CV"), au cas ou
// elle n'aurait pas suivi l'instruction d'echappement du prompt. Le % est
// le plus dangereux car il tronque SILENCIEUSEMENT la ligne sans erreur de
// compilation — c'est exactement le genre de bug deja rencontre le 31/08.
function findUnescapedLatexSpecials(text) {
  if (!text) return [];
  const found = [];
  const re = /(^|[^\\])([%&#])/g;
  let m;
  while ((m = re.exec(text)) !== null) {
    found.push(m[2]);
  }
  return [...new Set(found)];
}

async function countPdfPages(blob) {
  const buf = await blob.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  return pdf.numPages;
}

function decodeBase64Url(data) {
  try {
    const norm = data.replace(/-/g, "+").replace(/_/g, "/");
    const bin = atob(norm);
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return new TextDecoder("utf-8").decode(bytes);
  } catch (e) { return ""; }
}

// Parcourt récursivement les parties MIME pour trouver du texte exploitable
function extractBodyText(payload) {
  if (!payload) return "";
  if (payload.body && payload.body.data) {
    return decodeBase64Url(payload.body.data);
  }
  if (payload.parts) {
    const htmlPart = payload.parts.find(p => p.mimeType === "text/html");
    if (htmlPart) return extractBodyText(htmlPart);
    const textPart = payload.parts.find(p => p.mimeType === "text/plain");
    if (textPart) return extractBodyText(textPart);
    for (const p of payload.parts) {
      const r = extractBodyText(p);
      if (r) return r;
    }
  }
  return "";
}

function stripHtml(html) {
  return html.replace(/<style[\s\S]*?<\/style>/gi, "")
    .replace(/<script[\s\S]*?<\/script>/gi, "")
    .replace(/<[^>]+>/g, " ")
    .replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/&quot;/g, '"')
    .replace(/\s+/g, " ").trim();
}

// Convertit le HTML en texte lisible, en gardant les liens sous forme
// "Texte [URL]" pour que l'IA puisse a la fois lire et referencer les liens.
function htmlToReadableText(html) {
  let out = html.replace(/<style[\s\S]*?<\/style>/gi, "").replace(/<script[\s\S]*?<\/script>/gi, "");
  out = out.replace(/<a\b[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi, (full, url, inner) => {
    const text = stripHtml(inner).trim();
    if (!text || !url.startsWith("http")) return " ";
    return ` ${text} [${url}] `;
  });
  return stripHtml(out).slice(0, 6000);
}

function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

async function extractOffersWithAI(rawBody, meta, filters, geminiSettings) {
  const readable = htmlToReadableText(rawBody);
  if (readable.length < 40) return [];

  const model = (geminiSettings && geminiSettings.model) || "gemini-2.5-flash";
  const apiKey = geminiSettings && geminiSettings.apiKey;
  if (!apiKey) throw new Error("Aucune clé API Gemini configurée.");

  const system = `Tu analyses le contenu d'un email (alerte emploi ou newsletter) pour Sacha Laborde, qui cherche un poste front office en finance de marché.

Rôles recherchés : ${filters.roleKeywords.join(", ")}.
Lieux acceptés : ${filters.locationKeywords.join(", ")}.
Type de contrat accepté : ${filters.contractKeywords.join(", ")}.
À exclure absolument : ${filters.excludeKeywords.join(", ")}, ainsi que tout métier sans rapport avec la finance de marché front office (RH, compliance, IT support, commerce de détail, restauration, etc.).

Le texte ci-dessous est le contenu de l'email, avec chaque lien indiqué entre crochets juste après son texte, ex: "Sales Trading Intern [https://...]".

Identifie UNIQUEMENT les offres d'emploi RÉELLES qui correspondent VRAIMENT aux critères ci-dessus (rôle ET lieu ET type de contrat). Ignore tout le reste : liens de navigation, désabonnement, préférences, "voir toutes les offres", pied de page, offres hors périmètre. En cas de doute sur la pertinence d'une offre, ne la retiens pas.

Réponds UNIQUEMENT avec un tableau JSON valide (vide si rien ne correspond vraiment), sans texte avant/après, sans balise markdown :
[{"title":"...","company":"...","location":"...","url":"..."}]`;

  const user = `Contenu de l'email :\n${readable}`;
  const body = JSON.stringify({
    system_instruction: { parts: [{ text: system }] },
    contents: [{ role: "user", parts: [{ text: user }] }],
    generationConfig: { responseMimeType: "application/json" },
  });
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

  // Retry avec backoff exponentiel specifiquement pour les erreurs de limite
  // de debit (429) — le niveau gratuit de Gemini a un plafond de requetes
  // par minute assez bas, facilement atteint quand on scanne beaucoup
  // d'emails d'affilee.
  let response, lastErrText = "";
  const maxRetries = 4;
  for (let attempt = 0; attempt <= maxRetries; attempt++) {
    response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body });
    if (response.ok) break;
    if (response.status === 429 && attempt < maxRetries) {
      lastErrText = await response.text().catch(() => "");
      await sleep(2000 * Math.pow(2, attempt)); // 2s, 4s, 8s, 16s
      continue;
    }
    const errText = await response.text().catch(() => "");
    throw new Error(`Gemini (${response.status}): ${errText.slice(0, 200)}`);
  }
  if (!response.ok) {
    throw new Error(`Gemini (429) après ${maxRetries} tentatives : ${lastErrText.slice(0, 200)}`);
  }

  const data = await response.json();
  const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
  if (!text) return [];
  let arr;
  try {
    arr = parseAiJson(text);
  } catch (e) {
    return []; // email non exploitable, on l'ignore plutot que de faire planter tout le scan
  }
  if (!Array.isArray(arr)) return [];

  return arr.filter(o => o && o.title && o.url).map((o, i) => ({
    id: meta.id + "_ai_" + i,
    title: o.title,
    url: o.url,
    company: o.company || meta.company,
    source: meta.company,
    location: o.location || "",
    snippet: "",
    date: meta.date,
    emailSubject: meta.subject,
    gmailLink: meta.threadId ? `https://mail.google.com/mail/u/0/#all/${meta.threadId}` : "",
  }));
}

      let pageToken = null;
      do {
        const url = `https://gmail.googleapis.com/gmail/v1/users/me/messages?q=${encodeURIComponent(q)}&maxResults=500` + (pageToken ? `&pageToken=${pageToken}` : "");
        const listRes = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
        if (!listRes.ok) throw new Error("Gmail API (liste) : HTTP " + listRes.status);
        const listData = await listRes.json();
        ids = ids.concat((listData.messages || []).map(m => m.id));
        pageToken = listData.nextPageToken || null;
        setProgress(`${ids.length} email(s) trouvé(s)...`);
      } while (pageToken);

      // Memoire des emails deja analyses (par ID Gmail, stable dans le
      // temps) : on ne les renvoie JAMAIS a l'IA une deuxieme fois, on
      // reutilise directement le resultat deja calcule. Reduit enormement
      // le volume d'appels Gemini d'un rafraichissement a l'autre.
      const processedCache = LocalStore.get("gmail:processedCache") || {}; // { [emailId]: offers[] }
      const newIds = ids.filter(id => !(id in processedCache));
      const skippedCount = ids.length - newIds.length;

      const filters = getEmailFilters();
      const geminiSettings = LocalStore.get("settings:gemini") || {};
      let allOffers = [];
      let emailsScanned = 0;
      let aiErrors = 0;
      let firstErrorMsg = "";

      // Recupere d'abord les offres deja connues pour les emails non-nouveaux
      ids.forEach(id => {
        if (id in processedCache) allOffers = allOffers.concat(processedCache[id]);
      });

      for (const id of newIds) {
        const msgRes = await fetch(
          `https://gmail.googleapis.com/gmail/v1/users/me/messages/${id}?format=full`,
          { headers: { Authorization: `Bearer ${accessToken}` } }
        );
        if (!msgRes.ok) continue;
        const msg = await msgRes.json();
        emailsScanned++;
        setProgress(`Analyse IA ${emailsScanned}/${newIds.length} (${skippedCount} déjà en cache, ignoré(s))${aiErrors ? ` — ${aiErrors} échec(s)` : ""}...`);
        const headers = msg.payload && msg.payload.headers;
        const subject = headerValue(headers, "Subject");
        const from = headerValue(headers, "From");
        const date = headerValue(headers, "Date");
        const rawBody = extractBodyText(msg.payload);
        const meta = { id: msg.id, threadId: msg.threadId, subject, date, company: from.replace(/<.*>/, "").trim() };

        try {
          const offers = await extractOffersWithAI(rawBody, meta, filters, geminiSettings);
          allOffers = allOffers.concat(offers);
          processedCache[id] = offers; // memorise, meme si vide (= "analyse, rien trouve")
        } catch (e) {
          aiErrors++;
          if (!firstErrorMsg) firstErrorMsg = e.message;
          console.warn("Extraction IA échouée pour un email:", e.message);
          // pas mis en cache : on retentera cet email au prochain rafraichissement
        }

        // Pause proactive entre chaque appel Gemini pour rester sous la
        // limite de requetes/minute du niveau gratuit, plutot que de la
        // heurter systematiquement et devoir tout re-essayer.
        await sleep(1500);
      }

      // Purge du cache : on ne garde que les entrees encore pertinentes
      // (emails presents dans le dernier resultat de recherche), pour ne
      // pas laisser grossir indefiniment le stockage local.
      const idsSet = new Set(ids);
      const prunedCache = {};
      Object.keys(processedCache).forEach(id => { if (idsSet.has(id)) prunedCache[id] = processedCache[id]; });
      LocalStore.set("gmail:processedCache", prunedCache);

      setEmails(allOffers);
      LocalStore.set("gmail:cache", allOffers);
      setScanStats({ emails: emailsScanned, skipped: skippedCount, offers: allOffers.length, aiErrors, firstErrorMsg });
      setProgress("");
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  };

  const dismiss = (id) => {
    const next = [...dismissed, id];
    setDismissed(next);
    LocalStore.set("gmail:dismissed", next);
  };

  const [broadSearch, setBroadSearch] = useState(cfg.broadSearch !== false);
  const [labelDraft, setLabelDraft] = useState(cfg.label || "");

  const saveSenders = () => {
    const senders = sendersDraft.split("\n").map(s => s.trim()).filter(Boolean);
    const next = { ...cfg, senders, broadSearch, label: labelDraft.trim() };
    setCfg(next); setGmailConfig(next); setEditingSenders(false);
  };

  const saveFilters = () => {
    const parsed = {
      roleKeywords: filtersDraft.roleKeywords.split("\n").map(s => s.trim()).filter(Boolean),
      locationKeywords: filtersDraft.locationKeywords.split("\n").map(s => s.trim()).filter(Boolean),
      contractKeywords: filtersDraft.contractKeywords.split("\n").map(s => s.trim()).filter(Boolean),
      excludeKeywords: filtersDraft.excludeKeywords.split("\n").map(s => s.trim()).filter(Boolean),
    };
    setEmailFilters(parsed);
    setEditingFilters(false);
  };

  const visible = emails.filter(e => !dismissed.includes(e.id));

  return (
    <div className="panel">
      <div className="panel-head">
        Offres détectées dans tes emails
        <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
          <button className="btn" onClick={() => { setEditingSenders(v => !v); setEditingFilters(false); }}>Expéditeurs surveillés</button>
          <button className="btn" onClick={() => { setEditingFilters(v => !v); setEditingSenders(false); }}>Critères de filtrage</button>
          {!connected ? (
            <button className="btn primary" onClick={handleConnect}>Se connecter à Gmail</button>
          ) : (
            <button className="btn" onClick={fetchEmails} disabled={loading}>
              {loading ? <span><span className="spinner"></span>{progress || "Lecture..."}</span> : "Rafraîchir"}
            </button>
          )}
        </div>
      </div>

      {editingSenders && (
        <div style={{padding: 18, borderBottom: "1px solid var(--line)"}}>
          <div className="form-field">
            <label style={{display:"flex", alignItems:"center", gap:8, cursor:"pointer"}}>
              <input type="checkbox" checked={broadSearch} onChange={e => setBroadSearch(e.target.checked)} style={{width:"auto"}} />
              Recherche élargie (au-delà des expéditeurs connus, par mots-clés de sujet)
            </label>
          </div>
          <div className="form-field" style={{marginTop:10}}>
            <label>Libellé Gmail à inclure en plus (optionnel)</label>
            <input type="text" value={labelDraft} onChange={e => setLabelDraft(e.target.value)} placeholder="Offres Stage" />
          </div>
          <div className="hint" style={{marginTop:4}}>Tout email portant ce libellé sera inclus, EN PLUS de la recherche élargie — ce n'est pas une restriction, juste un filet de sécurité supplémentaire pour les emails que tu labellises toi-même à la main.</div>
          <div className="form-field" style={{marginTop:10}}>
            <label>Adresses expéditrices à surveiller (une par ligne — optionnel si la recherche élargie est activée)</label>
            <textarea rows={6} value={sendersDraft} onChange={e => setSendersDraft(e.target.value)} style={{fontFamily:"var(--font-mono)", fontSize:12}} />
          </div>
          <div className="hint" style={{marginTop:8}}>Avec la recherche élargie activée, tu n'as plus besoin de connaître ces adresses — l'app cherche tous les emails récents dont le sujet ressemble à une alerte emploi, puis filtre par critères.</div>
          <div className="dl-buttons"><button className="btn primary" onClick={saveSenders}>Enregistrer</button></div>
        </div>
      )}

      {editingFilters && (
        <div style={{padding: 18, borderBottom: "1px solid var(--line)"}}>
          <div className="desc">Une offre n'est retenue que si elle contient au moins un mot-clé de rôle ET un lieu ET un type de contrat, ET aucun mot-clé d'exclusion — exactement la même logique que le scraper.</div>
          <div className="field-grid">
            <div className="form-field"><label>Mots-clés de rôle (1 par ligne)</label><textarea rows={8} value={filtersDraft.roleKeywords} onChange={e => setFiltersDraft({...filtersDraft, roleKeywords: e.target.value})} style={{fontFamily:"var(--font-mono)", fontSize:11.5}} /></div>
            <div className="form-field"><label>Lieux (1 par ligne)</label><textarea rows={8} value={filtersDraft.locationKeywords} onChange={e => setFiltersDraft({...filtersDraft, locationKeywords: e.target.value})} style={{fontFamily:"var(--font-mono)", fontSize:11.5}} /></div>
            <div className="form-field"><label>Type de contrat (1 par ligne)</label><textarea rows={5} value={filtersDraft.contractKeywords} onChange={e => setFiltersDraft({...filtersDraft, contractKeywords: e.target.value})} style={{fontFamily:"var(--font-mono)", fontSize:11.5}} /></div>
            <div className="form-field"><label>Exclusions (1 par ligne)</label><textarea rows={5} value={filtersDraft.excludeKeywords} onChange={e => setFiltersDraft({...filtersDraft, excludeKeywords: e.target.value})} style={{fontFamily:"var(--font-mono)", fontSize:11.5}} /></div>
          </div>
          <div className="dl-buttons"><button className="btn primary" onClick={saveFilters}>Enregistrer les critères</button></div>
        </div>
      )}

      {!cfg.clientId && !editingSenders && !editingFilters && (
        <div className="disabled-note">Configure d'abord ton Client ID Google dans l'onglet Réglages.</div>
      )}

      {error && <div className="error-box">{error}</div>}
      {scanStats && !loading && (
        <div className="hint" style={{padding:"10px 20px 0"}}>
          {scanStats.emails} nouvel(aux) email(s) analysé(s) par l'IA{scanStats.skipped > 0 && ` (+ ${scanStats.skipped} déjà en cache, non ré-analysés)`} → {scanStats.offers} offre(s) au total.
          {scanStats.aiErrors > 0 && ` (${scanStats.aiErrors} email(s) n'ont pas pu être analysés.)`}
          {scanStats.firstErrorMsg && <div style={{color:"var(--ask)", marginTop:4}}>Premier message d'erreur rencontré : {scanStats.firstErrorMsg}</div>}
        </div>
      )}

      {connected && !loading && visible.length === 0 && !error && (
        <div className="empty-state">Aucune offre correspondant à tes critères pour l'instant — clique "Rafraîchir", ou élargis tes critères de filtrage.</div>
      )}

      {visible.length > 0 && (
        <table>
          <thead><tr><th>Poste</th><th>Contexte</th><th>Lieu</th><th>Source</th><th>Date</th><th></th></tr></thead>
          <tbody>
            {visible.map(e => (
              <tr key={e.id}>
                <td className="company-cell">{e.title}</td>
                <td className="role-cell">{e.snippet ? e.snippet.slice(0, 90) + "..." : "—"}</td>
                <td className="role-cell">{e.location || "—"}</td>
                <td className="role-cell">{e.company}</td>
                <td className="role-cell mono-num">{e.date ? new Date(e.date).toLocaleDateString("fr-FR") : "—"}</td>
                <td className="row-actions">
                  {e.url && <button onClick={() => window.open(e.url, "_blank")}>Voir l'offre ↗</button>}
                  {e.gmailLink && <button onClick={() => window.open(e.gmailLink, "_blank")}>Voir l'email ↗</button>}
                  <button onClick={() => onApply(e)}>Postuler</button>
                  <button className="danger" onClick={() => dismiss(e.id)}>Ignorer</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
    </div>
  );
}

/* ============================================================
   ONGLET PROSPECTION — génère des messages courts et personnalisés
   (LinkedIn / email) pour décrocher un call, + suivi des contacts.
   ============================================================ */
function Prospection({ applications }) {
  const [contacts, setContacts] = useState(() => getContacts());
  const [syncStatus, setSyncStatus] = useState("idle");
  const [expandedId, setExpandedId] = useState(null);
  const [view, setView] = useState("list"); // "list" | "new"
  const shaRef = useRef(null);
  const contactsPath = "contacts.json";

  useEffect(() => {
    (async () => {
      const cfg = GitHubSync.getConfig();
      if (!GitHubSync.isConfigured(cfg)) { setSyncStatus("off"); return; }
      setSyncStatus("busy");
      try {
        const { data, sha } = await GitHubSync.pull(cfg, false, contactsPath);
        shaRef.current = sha;
        if (data) { setContacts(data); saveContactsLocal(data); }
        setSyncStatus("ok");
      } catch (e) { setSyncStatus("err"); }
    })();
  }, []);

  const persist = async (next) => {
    setContacts(next);
    saveContactsLocal(next);
    const cfg = GitHubSync.getConfig();
    if (GitHubSync.isConfigured(cfg)) {
      setSyncStatus("busy");
      try {
        const newSha = await GitHubSync.push(cfg, next, shaRef.current, false, contactsPath);
        shaRef.current = newSha;
        setSyncStatus("ok");
      } catch (e) { setSyncStatus("err"); }
    }
  };

  const addContact = (entry) => persist([{ ...entry, id: Date.now().toString(), dateAdded: new Date().toISOString().slice(0, 10) }, ...contacts]);
  const updateStatus = (id, status) => persist(contacts.map(c => c.id === id ? { ...c, status } : c));
  const deleteContact = (id) => persist(contacts.filter(c => c.id !== id));

  const counts = CONTACT_STATUS_OPTIONS.reduce((acc, s) => { acc[s.value] = 0; return acc; }, {});
  contacts.forEach(c => { counts[c.status] = (counts[c.status] || 0) + 1; });

  const appLabel = (id) => {
    const a = (applications || []).find(a => a.id === id);
    return a ? `${a.company} — ${a.jobTitle}` : null;
  };

  if (view === "new") {
    return <NewContact applications={applications} onSave={(entry) => { addContact(entry); setView("list"); }} onCancel={() => setView("list")} />;
  }

  return (
    <React.Fragment>
      <div className="stat-grid">
        <div className="stat-cell"><div className="stat-label">Contacts</div><div className="stat-value">{contacts.length}</div></div>
        <div className="stat-cell"><div className="stat-label">Envoyés</div><div className="stat-value">{counts.envoye || 0}</div></div>
        <div className="stat-cell"><div className="stat-label">Répondus</div><div className="stat-value">{counts.repondu || 0}</div></div>
        <div className="stat-cell"><div className="stat-label">Calls obtenus</div><div className="stat-value bid">{counts.call_obtenu || 0}</div></div>
        <div className="stat-cell"><div className="stat-label">Sans réponse</div><div className="stat-value">{counts.sans_reponse || 0}</div></div>
      </div>
      <div className="panel">
        <div className="panel-head">
          Prospection
          <div style={{display:"flex", alignItems:"center", gap:12}}>
            <span className={"sync-badge " + (syncStatus === "ok" ? "ok" : syncStatus === "err" ? "err" : syncStatus === "busy" ? "busy" : "")}>
              {syncStatus === "off" && "Sync désactivée"}
              {syncStatus === "busy" && "Sync..."}
              {syncStatus === "ok" && "Synchronisé"}
              {syncStatus === "err" && "Erreur sync"}
            </span>
            <button className="btn primary" onClick={() => setView("new")}>+ Nouveau contact</button>
          </div>
        </div>
        {contacts.length === 0 ? (
          <div className="empty-state">Aucun contact pour l'instant. Clique "+ Nouveau contact" pour générer ton premier message.</div>
        ) : (
          <table>
            <thead><tr><th>Nom</th><th>Entreprise</th><th>Canal</th><th>Offre liée</th><th>Ajouté le</th><th>Statut</th><th></th></tr></thead>
            <tbody>
              {contacts.map(c => (
                <React.Fragment key={c.id}>
                  <tr onClick={() => setExpandedId(expandedId === c.id ? null : c.id)} style={{cursor:"pointer"}}>
                    <td className="company-cell">{c.name || "—"}</td>
                    <td className="role-cell">{c.company || "—"}</td>
                    <td className="role-cell">{(CHANNEL_OPTIONS.find(ch => ch.value === c.channel) || {}).label || c.channel}</td>
                    <td className="role-cell">{c.linkedApplicationId ? (appLabel(c.linkedApplicationId) || "Offre supprimée") : "—"}</td>
                    <td className="role-cell mono-num">{c.dateAdded}</td>
                    <td onClick={e => e.stopPropagation()}>
                      <select className={"status-select " + contactStatusClass(c.status)} value={c.status} onChange={e => updateStatus(c.id, e.target.value)}>
                        {CONTACT_STATUS_OPTIONS.map(s => <option key={s.value} value={s.value}>{s.label}</option>)}
                      </select>
                    </td>
                    <td className="row-actions" onClick={e => e.stopPropagation()}>
                      {c.linkedinUrl && <button onClick={() => window.open(c.linkedinUrl, "_blank")}>LinkedIn ↗</button>}
                      <button className="danger" onClick={() => { if (confirm("Supprimer ce contact ?")) deleteContact(c.id); }}>Suppr.</button>
                    </td>
                  </tr>
                  {expandedId === c.id && (
                    <tr className="detail-row"><td colSpan={7}>
                      <div className="detail-block">
                        {c.subject && <h4>Objet</h4>}
                        {c.subject && <p>{c.subject}</p>}
                        <h4 style={{marginTop: c.subject ? 14 : 0}}>Message</h4>
                        <p style={{whiteSpace:"pre-wrap"}}>{c.body}</p>
                        <div className="dl-buttons">
                          <button className="btn" onClick={() => { navigator.clipboard.writeText(c.body); }}>Copier le message</button>
                        </div>
                      </div>
                    </td></tr>
                  )}
                </React.Fragment>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </React.Fragment>
  );
}

function NewContact({ onSave, onCancel, applications }) {
  const [mode, setMode] = useState("generate"); // "generate" | "correct"
  const [name, setName] = useState("");
  const [company, setCompany] = useState("");
  const [role, setRole] = useState("");
  const [linkedinUrl, setLinkedinUrl] = useState("");
  const [channel, setChannel] = useState("linkedin_message");
  const [tone, setTone] = useState("professional");
  const [objective, setObjective] = useState("call");
  const [customObjective, setCustomObjective] = useState("");
  const [profileInfo, setProfileInfo] = useState("");
  const [offerText, setOfferText] = useState("");
  const [draftText, setDraftText] = useState("");
  const [linkedApplicationId, setLinkedApplicationId] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [draft, setDraft] = useState(null); // { subject, body }
  const [feedback, setFeedback] = useState("");

  const channelDef = CHANNEL_OPTIONS.find(c => c.value === channel);
  const canGenerate = mode === "correct" ? draftText.trim().length >= 10 : profileInfo.trim().length >= 20;

  // Si une offre du tracker est selectionnee, pre-remplit entreprise + contexte
  const handleLinkApplication = (appId) => {
    setLinkedApplicationId(appId);
    const app = (applications || []).find(a => a.id === appId);
    if (app) {
      if (!company) setCompany(app.company);
      if (!offerText) setOfferText(`Poste : ${app.jobTitle}${app.offerText ? "\n" + app.offerText : ""}`);
    }
  };

  const runGenerate = async (prevDraft, feedbackText) => {
    setError(""); setLoading(true);
    try {
      const geminiSettings = LocalStore.get("settings:gemini") || {};
      const result = mode === "correct"
        ? await correctDraftMessage(draftText, { channel, name, company, role, tone }, geminiSettings, prevDraft, feedbackText)
        : await generateOutreachMessage({ channel, name, company, role, profileInfo, offerText, tone, objective, customObjective }, geminiSettings, prevDraft, feedbackText);
      setDraft(result);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  };

  const handleGenerate = () => runGenerate(null, null);
  const handleRegenerate = () => { if (feedback.trim()) runGenerate(draft, feedback); };

  const handleSave = () => {
    onSave({ name, company, role, linkedinUrl, channel, tone, objective, profileInfo, offerText, draftText, linkedApplicationId: linkedApplicationId || null, subject: draft.subject, body: draft.body, status: "a_envoyer" });
  };

  const charCount = draft ? (draft.body || "").length : 0;
  const overLimit = channelDef.maxChars && charCount > channelDef.maxChars;

  return (
    <div className="panel">
      <div className="panel-head">
        Nouveau message de prospection
        <button className="btn" onClick={onCancel}>← Retour</button>
      </div>

      <div style={{padding:"18px 18px 0"}}>
        <label>Que veux-tu faire ?</label>
        <div className="dl-buttons" style={{marginTop:8}}>
          <button className={"btn" + (mode === "generate" ? " primary" : "")} onClick={() => { setMode("generate"); setDraft(null); }}>Générer depuis des informations</button>
          <button className={"btn" + (mode === "correct" ? " primary" : "")} onClick={() => { setMode("correct"); setDraft(null); }}>Corriger un brouillon que j'ai déjà écrit</button>
        </div>
      </div>

      <div className="form-grid">
        <div className="form-field">
          <label>Nom du contact</label>
          <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="ex. Jean Dupont" />
        </div>
        <div className="form-field">
          <label>Entreprise</label>
          <input type="text" value={company} onChange={e => setCompany(e.target.value)} placeholder="ex. BNP Paribas CIB" />
        </div>
        <div className="form-field">
          <label>Poste actuel du contact</label>
          <input type="text" value={role} onChange={e => setRole(e.target.value)} placeholder="ex. VP Equity Derivatives Sales" />
        </div>
        <div className="form-field">
          <label>Lien LinkedIn (référence uniquement)</label>
          <input type="url" value={linkedinUrl} onChange={e => setLinkedinUrl(e.target.value)} placeholder="https://linkedin.com/in/..." />
        </div>
        <div className="form-field">
          <label>Canal</label>
          <select value={channel} onChange={e => setChannel(e.target.value)}>
            {CHANNEL_OPTIONS.map(c => <option key={c.value} value={c.value}>{c.label}</option>)}
          </select>
        </div>
        <div className="form-field">
          <label>Registre / ton</label>
          <select value={tone} onChange={e => setTone(e.target.value)}>
            {TONE_OPTIONS.map(t => <option key={t.value} value={t.value}>{t.label}</option>)}
          </select>
        </div>
        {mode === "generate" && (
          <div className="form-field full">
            <label>Objectif du message</label>
            <select value={objective} onChange={e => setObjective(e.target.value)}>
              {OBJECTIVE_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
            </select>
          </div>
        )}
        {mode === "generate" && objective === "custom" && (
          <div className="form-field full">
            <label>Précise l'objectif</label>
            <input type="text" value={customObjective} onChange={e => setCustomObjective(e.target.value)} placeholder="ex. Demander un retour sur mon dossier, proposer un café..." />
          </div>
        )}
        {(applications && applications.length > 0) && (
          <div className="form-field full">
            <label>Lier à une candidature du tracker (optionnel)</label>
            <select value={linkedApplicationId} onChange={e => handleLinkApplication(e.target.value)}>
              <option value="">— Aucune —</option>
              {applications.map(a => <option key={a.id} value={a.id}>{a.company} — {a.jobTitle}</option>)}
            </select>
          </div>
        )}

        {mode === "correct" ? (
          <div className="form-field full">
            <label>Ton brouillon (colle-le tel quel, l'IA corrige sans tout réécrire)</label>
            <textarea rows={7} value={draftText} onChange={e => setDraftText(e.target.value)} placeholder="Colle ici ton message tel que tu l'as écrit..." />
          </div>
        ) : (
          <React.Fragment>
            <div className="form-field full">
              <label>Infos du profil (colle ce que tu vois sur LinkedIn — poste, parcours, ce qui t'accroche)</label>
              <textarea rows={5} value={profileInfo} onChange={e => setProfileInfo(e.target.value)} placeholder="ex. VP sur le desk Equity Derivatives depuis 3 ans, ancien Jane Street, a posté récemment sur..." />
            </div>
            <div className="form-field full">
              <label>Offre ou contexte lié (optionnel)</label>
              <textarea rows={3} value={offerText} onChange={e => setOfferText(e.target.value)} placeholder="Colle ici le texte de l'offre si cette prise de contact y est liée..." />
            </div>
          </React.Fragment>
        )}
      </div>
      {error && <div className="error-box">{error}</div>}
      <div className="form-footer">

        <button className="btn primary" disabled={!canGenerate || loading} onClick={handleGenerate}>
          {loading ? <span><span className="spinner"></span>{mode === "correct" ? "Correction..." : "Rédaction..."}</span> : (mode === "correct" ? "Corriger" : "Générer le message")}
        </button>
      </div>

      {draft && (
        <div className="preview-wrap">
          {channelDef.value === "email" && (
            <div className="preview-section">

            </div>
          )}
          <div className="preview-section">
            <h3>Message {channelDef.maxChars && <span style={{color: overLimit ? "var(--ask)" : "var(--amber-faint)", fontWeight: 400, textTransform: "none", letterSpacing: 0}}> — {charCount}/{channelDef.maxChars} caractères{overLimit ? " (dépassement !)" : ""}</span>}</h3>
            <textarea rows={8} value={draft.body || ""} onChange={e => setDraft({...draft, body: e.target.value})} style={{fontFamily:"var(--font-mono)", fontSize:12.5}} />
          </div>

          <div style={{marginTop:10, borderTop:"1px solid var(--line-soft)", paddingTop:12}}>
            <label>Pas satisfait ? Explique pourquoi et régénère</label>
            <textarea rows={2} value={feedback} onChange={e => setFeedback(e.target.value)} placeholder="ex. Trop formel, accroche plus sur son parcours chez..." style={{marginTop:6}} />
            <div className="dl-buttons">
              <button className="btn" disabled={loading || !feedback.trim()} onClick={handleRegenerate}>
                {loading ? <span><span className="spinner"></span>Régénération...</span> : "Régénérer avec ce commentaire"}
              </button>
            </div>
          </div>

          <div className="dl-buttons">
            <button className="btn" onClick={() => navigator.clipboard.writeText(draft.body)}>Copier le message</button>
            <button className="btn primary" onClick={handleSave}>Enregistrer dans le suivi</button>
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [view, setView] = useState("tracker");
  const [applications, setApplications] = useState([]);
  const [loadingApps, setLoadingApps] = useState(true);
  const [expandedId, setExpandedId] = useState(null);
  const [prefill, setPrefill] = useState(null);
  const [syncStatus, setSyncStatus] = useState("idle"); // idle | busy | ok | err | off
  const [syncError, setSyncError] = useState("");
  const shaRef = useRef(null);

  const githubCfg = GitHubSync.getConfig();
  const githubReady = GitHubSync.isConfigured(githubCfg);

  useEffect(() => {
    (async () => {
      const local = LocalStore.get("tracker:applications") || [];
      setApplications(local);
      setLoadingApps(false);

      if (githubReady) {
        setSyncStatus("busy");
        try {
          const { data, sha } = await GitHubSync.pull(githubCfg);
          shaRef.current = sha;
          if (data) {
            setApplications(data);
            LocalStore.set("tracker:applications", data);
          }
          // Recupere aussi le/les CV maitre(s) sauvegardes sur GitHub — sans
          // ca, un appareil qui n'a jamais visite "Mon CV" localement reste
          // bloque sur le template par defaut integre au code (potentiellement
          // perime si un autre appareil a enregistre une version plus recente).
          // Bug reel identifie le 19/08 : deux CV generes le meme jour sur deux
          // appareils differents, avec deux mises en forme differentes.
          for (const [type, ct] of Object.entries(CONTRACT_TYPES)) {
            if (!ct.ready) continue;
            try {
              const fileCfg = { ...githubCfg, path: `cv_master_${type}.tex` };
              const pulled = await GitHubSync.pull(fileCfg, true);
              if (pulled.data) {
                LocalStore.set("cvMaster:" + type, pulled.data);
                LocalStore.set("cvMasterSha:" + type, pulled.sha);
              }
            } catch (e) {
              console.warn(`Sync CV maître (${type}) échouée :`, e.message);
              // non bloquant : on continue avec la version locale/par defaut
            }
          }
          setSyncStatus("ok");
        } catch (e) {
          setSyncStatus("err"); setSyncError(e.message);
        }
      } else {
        setSyncStatus("off");
      }
    })();
  }, []);

  const persist = useCallback(async (next) => {
    setApplications(next);
    LocalStore.set("tracker:applications", next);
    const cfg = GitHubSync.getConfig();
    if (GitHubSync.isConfigured(cfg)) {
      setSyncStatus("busy");
      try {
        const newSha = await GitHubSync.push(cfg, next, shaRef.current);
        shaRef.current = newSha;
        setSyncStatus("ok");
      } catch (e) {
        setSyncStatus("err"); setSyncError(e.message);
      }
    }
  }, []);

  const addApplication = (entry) => persist([{ ...entry, id: Date.now().toString(), dateAdded: new Date().toISOString().slice(0, 10) }, ...applications]);
  const updateStatus = (id, status) => persist(applications.map(a => a.id === id ? { ...a, status } : a));
  const deleteApp = (id) => persist(applications.filter(a => a.id !== id));
  const updateApp = (id, patch) => persist(applications.map(a => a.id === id ? { ...a, ...patch } : a));
  const markAudited = (ids) => { const d = new Date().toISOString().slice(0, 10); persist(applications.map(a => ids.includes(a.id) ? { ...a, auditExportedAt: d } : a)); };

  const counts = STATUS_OPTIONS.reduce((acc, s) => { acc[s.value] = 0; return acc; }, {});
  applications.forEach(a => { counts[a.status] = (counts[a.status] || 0) + 1; });

  return (
    <div className="app">
      <TapeTicker applications={applications} />
      <div className="topbar">
        <div>
          <div className="brand-eyebrow">Front Office / Standalone</div>
          <div className="brand-title">Pilot — Candidatures</div>
          <div className="brand-sub">Sacha Laborde · fonctionne hors Claude · données en local {githubReady ? "+ GitHub" : ""} · build {BUILD_VERSION}</div>
        </div>
        <div style={{display:"flex", alignItems:"center", gap:12}}>
          <span className={"sync-badge " + (syncStatus === "ok" ? "ok" : syncStatus === "err" ? "err" : syncStatus === "busy" ? "busy" : "")}>
            {syncStatus === "off" && "Sync GitHub désactivée"}
            {syncStatus === "busy" && "Synchronisation..."}
            {syncStatus === "ok" && "Synchronisé"}
            {syncStatus === "err" && "Erreur de sync"}
            {syncStatus === "idle" && "..."}
          </span>
          <div className="tabs">
            <button className={"tab-btn" + (view === "tracker" ? " active" : "")} onClick={() => setView("tracker")}>Tracker</button>
            <button className={"tab-btn" + (view === "emails" ? " active" : "")} onClick={() => setView("emails")}>Emails</button>
            <button className={"tab-btn" + (view === "new" ? " active" : "")} onClick={() => { setPrefill(null); setView("new"); }}>+ Candidature</button>
            <button className={"tab-btn" + (view === "prospection" ? " active" : "")} onClick={() => setView("prospection")}>Prospection</button>
            <button className={"tab-btn" + (view === "cv" ? " active" : "")} onClick={() => setView("cv")}>Mon CV</button>
            <button className={"tab-btn" + (view === "settings" ? " active" : "")} onClick={() => setView("settings")}>Réglages</button>
          </div>
        </div>
      </div>

      {syncStatus === "err" && <div className="error-box">Sync GitHub : {syncError} — tes données restent sauvegardées en local dans ce navigateur.</div>}

      {view === "tracker" && (
        <Tracker applications={applications} loading={loadingApps} counts={counts} expandedId={expandedId} setExpandedId={setExpandedId} updateStatus={updateStatus} deleteApp={deleteApp} updateApp={updateApp} markAudited={markAudited} />
      )}
      {view === "emails" && (
        <GmailInbox onApply={(offer) => {
          setPrefill({
            company: offer.company || "",
            jobTitle: offer.title || "",
            location: offer.location || "Paris",
            jobUrl: offer.url || "",
            offerText: offer.snippet || "",
          });
          setView("new");
        }} />
      )}
      {view === "new" && (
        <NewApplication prefill={prefill} onSave={(entry) => { addApplication(entry); setPrefill(null); setView("tracker"); }} />
      )}
      {view === "prospection" && <Prospection applications={applications} />}
      {view === "cv" && <CvEditor />}
      {view === "settings" && <Settings />}
    </div>
  );
}

/* ============================================================
   COMPILATION PDF DIRECTE — via l'API publique latex.ytotech.com
   (LaTeX-on-HTTP, gratuit, open source). Aucune donnée persistée
   côté serveur au-delà de la requête. En cas d'échec, le .tex
   reste toujours téléchargeable en secours (Overleaf).
   ============================================================ */
async function compilePdfViaApi(texSource) {
  const response = await fetch("https://latex.ytotech.com/builds/sync", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      compiler: "pdflatex",
      resources: [{ main: true, content: texSource }],
    }),
  });
  if (!response.ok) {
    let detail = "";
    try {
      const errJson = await response.json();
      detail = errJson.logs || errJson.message || JSON.stringify(errJson).slice(0, 300);
    } catch (e) {
      detail = await response.text().catch(() => "");
    }
    throw new Error(`Échec de compilation (HTTP ${response.status}). ${detail.slice(0, 300)}`);
  }
  return await response.blob();
}

function downloadBlob(filename, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function PdfDownloadButton({ tex, filename, docType }) {
  const [state, setState] = useState("idle"); // idle | busy | err
  const [errMsg, setErrMsg] = useState("");
  const [progressMsg, setProgressMsg] = useState("");

  const handleClick = async () => {
    setState("busy"); setErrMsg(""); setProgressMsg("");
    try {
      const pdfBytes = await compileWithOnePageGuarantee(tex, docType, (level, total) => {
        setProgressMsg(level === 0 ? "Compilation..." : `Ajustement de la mise en page (${level}/${total - 1})...`);
      });
      downloadBinaryFile(filename, pdfBytes, "application/pdf");
      setState("idle");
    } catch (e) {
      setState("err");
      setErrMsg(e.message + " — utilise le bouton .tex ci-contre et Overleaf en secours.");
    }
  };

  return (
    <span>
      <button className="btn primary" onClick={handleClick} disabled={!tex || state === "busy"}>
        {state === "busy" ? <span><span className="spinner"></span>{progressMsg || "Compilation..."}</span> : "Télécharger le PDF"}
      </button>
      {state === "err" && <div className="error-box" style={{margin:"8px 0 0", display:"inline-block"}}>{errMsg}</div>}
    </span>
  );
}

function NewApplication({ onSave, prefill }) {
  const [contractType, setContractType] = useState("stage");
