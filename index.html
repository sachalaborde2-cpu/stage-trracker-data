// cache navigateur ou GitHub Pages qui n'aurait pas propage a temps).
const BUILD_VERSION = "2026-08-26 09:41 UTC";

const LocalStore = {
  get(key) {
    try {
      const v = localStorage.getItem(key);
      return v !== null ? JSON.parse(v) : null;
    } catch (e) { return null; }
  },
  set(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) { return false; }
  },
};

/* ============================================================
   SYNCHRONISATION GITHUB (optionnelle — mêmes candidatures partout)
   Stocke tracker.json à la racine du repo que tu configures.
   Token stocké uniquement dans ton navigateur (localStorage),
   jamais envoyé ailleurs qu'à l'API GitHub officielle.
   ============================================================ */
const GitHubSync = {
  getConfig() {
    return LocalStore.get("settings:github") || { token: "", owner: "", repo: "", path: "tracker.json" };
  },
  setConfig(cfg) {
    LocalStore.set("settings:github", cfg);
  },
  isConfigured(cfg) {
    return !!(cfg && cfg.token && cfg.owner && cfg.repo);
  },
  async pull(cfg, raw, pathOverride) {
    const path = pathOverride || cfg.path;
    const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`;
    const res = await fetch(url, { headers: { Authorization: `Bearer ${cfg.token}`, Accept: "application/vnd.github+json" } });
    if (res.status === 404) return { data: null, sha: null };
    if (!res.ok) throw new Error("GitHub pull: HTTP " + res.status);
    const json = await res.json();
    const decoded = decodeURIComponent(escape(atob(json.content.replace(/\n/g, ""))));
    return { data: raw ? decoded : JSON.parse(decoded), sha: json.sha };
  },
  async push(cfg, data, sha, raw, pathOverride) {
    const path = pathOverride || cfg.path;
    const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`;
    const payload = raw ? data : JSON.stringify(data, null, 2);
    const content = btoa(unescape(encodeURIComponent(payload)));
    const body = { message: `Update ${path} (` + new Date().toISOString() + ")", content };
    if (sha) body.sha = sha;
    const res = await fetch(url, {
      method: "PUT",
      headers: { Authorization: `Bearer ${cfg.token}`, Accept: "application/vnd.github+json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const errText = await res.text().catch(() => "");
      throw new Error("GitHub push: HTTP " + res.status + " " + errText.slice(0, 200));
    }
    const json = await res.json();
    return json.content.sha;
  },
};

function escapeLatex(str) {
  if (!str) return str;
  return str.replace(/\\/g, "\\textbackslash{}").replace(/&/g, "\\&").replace(/%/g, "\\%")
    .replace(/\$/g, "\\$").replace(/#/g, "\\#").replace(/_/g, "\\_")
    .replace(/\{/g, "\\{").replace(/\}/g, "\\}")
    .replace(/~/g, "\\textasciitilde{}").replace(/\^/g, "\\textasciicircum{}");
}
function articleFor(word) {
  if (!word) return "a";
  return /^[aeiouAEIOU]/.test(word.trim()) ? "an" : "a";
}
function downloadTextFile(filename, content) {
  const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function downloadBinaryFile(filename, arrayBuffer, mime) {
  const blob = new Blob([arrayBuffer], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ============================================================
   COMPILATION PDF DIRECTE avec garantie 1 page
   Utilise l'API publique latex-on-http (latex.ytotech.com).
   Même logique de resserrage automatique (marges + interligne)
   que celle validée précédemment, transposée en JS.
   ============================================================ */
const CV_PDF_FALLBACKS = [
  { top: "0.5in", bottom: "0.5in", left: "0.6in", right: "0.6in", stretch: "1.0" },
  { top: "0.3in", bottom: "0.3in", left: "0.45in", right: "0.45in", stretch: "0.97" },
  { top: "0.2in", bottom: "0.2in", left: "0.35in", right: "0.35in", stretch: "0.94" },
  { top: "0.12in", bottom: "0.12in", left: "0.25in", right: "0.25in", stretch: "0.90" },
];
const LM_PDF_FALLBACKS = [
  { top: "1in", bottom: "1in", left: "1in", right: "1in", stretch: "1.1" },
  { top: "0.9in", bottom: "0.9in", left: "0.9in", right: "0.9in", stretch: "1.05" },
  { top: "0.8in", bottom: "0.8in", left: "0.8in", right: "0.8in", stretch: "1.0" },
  { top: "0.7in", bottom: "0.7in", left: "0.7in", right: "0.7in", stretch: "0.95" },
];

function applyPdfGeometry(tex, docType, level) {
  const fb = (docType === "cv" ? CV_PDF_FALLBACKS : LM_PDF_FALLBACKS)[level];
  let out = tex.replace(/\\usepackage\[top=[^\]]*\]\{geometry\}/,
    `\\usepackage[top=${fb.top}, bottom=${fb.bottom}, left=${fb.left}, right=${fb.right}]{geometry}`);
  if (docType === "cv") {
    if (out.includes("\\renewcommand{\\baselinestretch}")) {
      out = out.replace(/\\renewcommand\{\\baselinestretch\}\{[^}]*\}/, `\\renewcommand{\\baselinestretch}{${fb.stretch}}`);
    } else {
      out = out.replace("\\pagestyle{empty}", `\\renewcommand{\\baselinestretch}{${fb.stretch}}\n\\pagestyle{empty}`);
    }
  } else {
    out = out.replace(/\\setstretch\{[^}]*\}/, `\\setstretch{${fb.stretch}}`);
  }
  return out;
}

async function compileViaApi(tex) {
  const res = await fetch("https://latex.ytotech.com/builds/sync", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ compiler: "pdflatex", resources: [{ main: true, content: tex }] }),
  });
  if (!res.ok) {
    let msg = "Erreur de compilation (HTTP " + res.status + ")";
    try {
      const errJson = await res.json();
      if (errJson && errJson.logs) msg += " : " + String(errJson.logs).slice(-400);
    } catch (e) {}
    throw new Error(msg);
  }
  return await res.arrayBuffer();
}

async function countPdfPagesFromBuffer(arrayBuffer) {
  const doc = await PDFLib.PDFDocument.load(arrayBuffer);
  return doc.getPageCount();
}

async function compileWithOnePageGuarantee(tex, docType, onProgress) {
  const fallbacks = docType === "cv" ? CV_PDF_FALLBACKS : LM_PDF_FALLBACKS;
  for (let level = 0; level < fallbacks.length; level++) {
    if (onProgress) onProgress(level, fallbacks.length);
    const attemptTex = applyPdfGeometry(tex, docType, level);
    const pdfBytes = await compileViaApi(attemptTex);
    const pages = await countPdfPagesFromBuffer(pdfBytes);
    if (pages === 1) return pdfBytes;
  }
  throw new Error("Le contenu dépasse 1 page même au resserrement maximal — raccourcis un mot-clé ou un champ de la lettre puis réessaie.");
}

async function saveMasterCv(contractType, tex) {
  LocalStore.set("cvMaster:" + contractType, tex);

function buildCvTex(contractType, headlineFill, keywordChanges, programType, programYear) {
  const ct = CONTRACT_TYPES[contractType];
  if (!ct || !ct.ready) return null;
  const year = programYear || "2027";
  const fill = escapeLatex(headlineFill || "Front Office");
  let sentence;
  if (contractType === "stage") {
    sentence = programType === "summer"
      ? `Client Solutions Intern at FactSet, seeking a Summer Front Office internship (${fill}) in ${year}.`
      : `Client Solutions Intern at FactSet, seeking a 6-month Front Office internship (${fill}) starting January ${year}.`;
  } else {
    sentence = `Client Solutions Intern at FactSet, seeking a ${fill} position.`;
  }
  let tex = getMasterCv(contractType).replace("__HEADLINE_SENTENCE__", sentence);
  // Seuls les bullets explicitement designes comme modifiables (ct.editableBullets)
  // peuvent etre substitues — sans cette liste blanche, un "old" propose par
  // l'IA qui correspond par hasard a un AUTRE passage du CV (ex: un bullet
  // Education non destine a etre touche) serait quand meme remplace, ce qui
  // s'est reellement produit (bug confirme le 19/08).
  const allowedOldTexts = new Set(Object.values(ct.editableBullets || {}));
  (keywordChanges || []).forEach(({ old: oldTxt, new: newTxt }) => {
    if (!oldTxt || !newTxt) return;
    if (!allowedOldTexts.has(oldTxt)) return; // hors des emplacements autorises : ignore
    if (!tex.includes(oldTxt)) return;
    tex = tex.replace(oldTxt, escapeLatex(newTxt));
  });
  return tex;
}

function buildLmTex(contractType, fields, programType, programYear) {
  const ct = CONTRACT_TYPES[contractType];

  const year = programYear || "2027";

  const jobTitle = escapeLatex(rawJobTitle);

  para1 = para1.split("__COMPANY__").join(company).split("__ARTICLE__").join(article)
    .split("__JOBTITLE__").join(jobTitle).split("__YEAR__").join(year).split("__TEAM__").join(team);

  return ct.lmTemplate
    .split("__PARA1__").join(para1)
    .split("__COMPANY__").join(company)
    .split("__ARTICLE__").join(article)
    .split("__JOBTITLE__").join(jobTitle)
    .split("__TASK1__").join(escapeLatex(f.task1) || "[Task 1]")
    .split("__TASK2__").join(escapeLatex(f.task2) || "[Task 2]")
    .split("__TASK3__").join(escapeLatex(f.task3) || "[Task 3]")
    .split("__SPECIFICDESK__").join(escapeLatex(f.specificDesk) || "[Specific Desk]")
    .split("__TARGETPROFESSION__").join(escapeLatex(f.targetProfession) || "[Target Profession]")
    .split("__TEAM__").join(team);
}

// Extrait tous les \item ... d'un CV LaTeX, pour construire le menu de
// sélection "quel bullet remplacer" (texte exact, garanti présent).
function extractCvBullets(cvText) {
  const matches = [...cvText.matchAll(/\\item\s+([^\n]+?)(?=\n\s*(?:\\item|\\end\{itemize\}))/g)];
  return matches.map(m => m[1].trim()).filter(Boolean);
}

/* ============================================================
   GÉNÉRATION DE MESSAGE DE PROSPECTION — court, personnalisé,
   objectif : obtenir un call. Contraintes strictes de longueur
   selon le canal (300 caractères max pour une note de connexion
   LinkedIn, c'est une vraie limite technique de LinkedIn).
   ============================================================ */
async function generateOutreachMessage(params, geminiSettings, previousDraft, feedback) {
  const { channel, name, company, role, profileInfo, offerText } = params;
  const channelDef = CHANNEL_OPTIONS.find(c => c.value === channel) || CHANNEL_OPTIONS[1];

  const channelInstructions = {
    connection_note: `Note de demande de connexion LinkedIn. LIMITE STRICTE ET ABSOLUE : 300 caractères MAXIMUM, espaces compris (c'est une vraie limite technique de LinkedIn, pas une suggestion). Pas d'objet. Format très condensé : une accroche personnalisée + une phrase sur pourquoi + l'appel à l'action. Réponds avec {"subject":null,"body":"..."}`,
    linkedin_message: `Message LinkedIn à quelqu'un déjà dans le réseau de Sacha. Vise 400 à 700 caractères — court, direct, pas de blabla. Pas d'objet. Réponds avec {"subject":null,"body":"..."}`,
    email: `Email professionnel. Objet court et accrocheur (moins de 8 mots), corps du message concis (100-150 mots maximum). Réponds avec {"subject":"...","body":"..."}`,
  };

  const system = `Tu rédiges un message de prospection pour Sacha Laborde, étudiant M1 Finance (Paris 1 Panthéon-Sorbonne), actuellement stagiaire chez FactSet, qui cherche à échanger avec des professionnels de la finance de marché (sales, trading, structuring) pour obtenir un appel — PAS pour postuler directement, l'objectif est la conversation, pas la candidature.

RÈGLES STRICTES :
1. Public cible : professionnels de la finance de marché, très peu de temps disponible. Le message doit être COURT, CLAIR, et susciter la curiosité — jamais de blabla, jamais de phrase generique du type "je serais ravi d'échanger avec vous".
2. Personnalisation RÉELLE et OBLIGATOIRE : le message doit faire référence à un élément concret et spécifique du profil fourni ci-dessous (poste actuel, parcours, desk, réalisation mentionnée...) — jamais un message qui pourrait être envoyé à n'importe qui.
3. Objectif final explicite mais soft : obtenir un call, pas un CV, pas une candidature formelle.
4. Le message DOIT contenir, à l'endroit approprié, le texte exact suivant tel quel (Sacha le remplira lui-même) : [PROPOSE ICI 2-3 CRÉNEAUX]
5. Ne jamais inventer de faits sur Sacha au-delà de : étudiant M1 Finance Sorbonne, stagiaire FactSet (Client Solutions, Pre-sales & Portfolio Analytics), cherche à échanger avec des professionnels front office.
6. ${channelInstructions[channel]}
7. Réponds UNIQUEMENT en JSON valide, sans texte avant/après, sans balise markdown.`;

  let user = `Destinataire : ${name || "(nom non précisé)"}${role ? ", " + role : ""}${company ? " chez " + company : ""}
Infos du profil (collées par Sacha depuis LinkedIn) :
${profileInfo || "(aucune info fournie)"}`;
  if (offerText) user += `\n\nOffre/contexte lié (optionnel) :\n${offerText}`;
  if (previousDraft && feedback) {
    user += `\n\nUne première version avait été proposée :\n${JSON.stringify(previousDraft)}\n\nSacha n'en est pas satisfait et précise :\n${feedback}\n\nPropose une nouvelle version qui tient compte de cette remarque, en respectant toujours la limite de longueur.`;
  }

  const model = (geminiSettings && geminiSettings.model) || "gemini-2.5-flash";
  const apiKey = geminiSettings && geminiSettings.apiKey;
  if (!apiKey) throw new Error("Aucune clé API Gemini configurée — va dans l'onglet Réglages.");

  const response = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: system }] },
        contents: [{ role: "user", parts: [{ text: user }] }],
        generationConfig: { responseMimeType: "application/json" },
      }),
    }
  );
  if (!response.ok) {
    const errText = await response.text().catch(() => "");
    throw new Error(`Erreur API Gemini (${response.status}): ${errText.slice(0, 200)}`);
  }
  const data = await response.json();
  const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
  if (!text) throw new Error("Réponse Gemini vide ou inattendue.");
  let result;
  try { result = JSON.parse(text); }
  catch (e) {
    const clean = text.replace(/^```json/i, "").replace(/^```/, "").replace(/```$/, "").trim();
    result = JSON.parse(clean);
  }
  return result;
}

function decodeBase64Url(data) {
  try {
    const norm = data.replace(/-/g, "+").replace(/_/g, "/");
    const bin = atob(norm);
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return new TextDecoder("utf-8").decode(bytes);
  } catch (e) { return ""; }
}

// Parcourt récursivement les parties MIME pour trouver du texte exploitable
function extractBodyText(payload) {
  if (!payload) return "";
  if (payload.body && payload.body.data) {
    return decodeBase64Url(payload.body.data);
  }
  if (payload.parts) {
    const htmlPart = payload.parts.find(p => p.mimeType === "text/html");
    if (htmlPart) return extractBodyText(htmlPart);
    const textPart = payload.parts.find(p => p.mimeType === "text/plain");
    if (textPart) return extractBodyText(textPart);
    for (const p of payload.parts) {
      const r = extractBodyText(p);
      if (r) return r;
    }
  }
  return "";
}

function stripHtml(html) {
  return html.replace(/<style[\s\S]*?<\/style>/gi, "")
    .replace(/<script[\s\S]*?<\/script>/gi, "")
    .replace(/<[^>]+>/g, " ")
    .replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/&quot;/g, '"')
    .replace(/\s+/g, " ").trim();
}

// Convertit le HTML en texte lisible, en gardant les liens sous forme
// "Texte [URL]" pour que l'IA puisse a la fois lire et referencer les liens.
function htmlToReadableText(html) {
  let out = html.replace(/<style[\s\S]*?<\/style>/gi, "").replace(/<script[\s\S]*?<\/script>/gi, "");
  out = out.replace(/<a\b[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi, (full, url, inner) => {
    const text = stripHtml(inner).trim();
    if (!text || !url.startsWith("http")) return " ";
    return ` ${text} [${url}] `;
  });
  return stripHtml(out).slice(0, 6000);
}

// Extraction par IA : on delegue a Gemini la comprehension du contenu de
// l'email (bien plus robuste qu'un parsing par regex face a des formats
// tres variables d'une plateforme a l'autre — LinkedIn, Indeed, WTTJ...).
function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

async function extractOffersWithAI(rawBody, meta, filters, geminiSettings) {
  const readable = htmlToReadableText(rawBody);
  if (readable.length < 40) return [];

  const model = (geminiSettings && geminiSettings.model) || "gemini-2.5-flash";
  const apiKey = geminiSettings && geminiSettings.apiKey;
  if (!apiKey) throw new Error("Aucune clé API Gemini configurée.");

  const system = `Tu analyses le contenu d'un email (alerte emploi ou newsletter) pour Sacha Laborde, qui cherche un poste front office en finance de marché.

Rôles recherchés : ${filters.roleKeywords.join(", ")}.
Lieux acceptés : ${filters.locationKeywords.join(", ")}.
Type de contrat accepté : ${filters.contractKeywords.join(", ")}.
À exclure absolument : ${filters.excludeKeywords.join(", ")}, ainsi que tout métier sans rapport avec la finance de marché front office (RH, compliance, IT support, commerce de détail, restauration, etc.).

Le texte ci-dessous est le contenu de l'email, avec chaque lien indiqué entre crochets juste après son texte, ex: "Sales Trading Intern [https://...]".

Identifie UNIQUEMENT les offres d'emploi RÉELLES qui correspondent VRAIMENT aux critères ci-dessus (rôle ET lieu ET type de contrat). Ignore tout le reste : liens de navigation, désabonnement, préférences, "voir toutes les offres", pied de page, offres hors périmètre. En cas de doute sur la pertinence d'une offre, ne la retiens pas.

Réponds UNIQUEMENT avec un tableau JSON valide (vide si rien ne correspond vraiment), sans texte avant/après, sans balise markdown :
[{"title":"...","company":"...","location":"...","url":"..."}]`;

  const user = `Contenu de l'email :\n${readable}`;
  const body = JSON.stringify({
    system_instruction: { parts: [{ text: system }] },
    contents: [{ role: "user", parts: [{ text: user }] }],
    generationConfig: { responseMimeType: "application/json" },
  });
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

  // Retry avec backoff exponentiel specifiquement pour les erreurs de limite
  // de debit (429) — le niveau gratuit de Gemini a un plafond de requetes
  // par minute assez bas, facilement atteint quand on scanne beaucoup
  // d'emails d'affilee.
  let response, lastErrText = "";
  const maxRetries = 4;
  for (let attempt = 0; attempt <= maxRetries; attempt++) {
    response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body });
    if (response.ok) break;
    if (response.status === 429 && attempt < maxRetries) {
      lastErrText = await response.text().catch(() => "");
      await sleep(2000 * Math.pow(2, attempt)); // 2s, 4s, 8s, 16s
      continue;
    }
    const errText = await response.text().catch(() => "");
    throw new Error(`Gemini (${response.status}): ${errText.slice(0, 200)}`);
  }
  if (!response.ok) {
    throw new Error(`Gemini (429) après ${maxRetries} tentatives : ${lastErrText.slice(0, 200)}`);
  }

  const data = await response.json();
  const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
  if (!text) return [];
  let arr;
  try {
    arr = JSON.parse(text);
  } catch (e) {
    const clean = text.replace(/^```json/i, "").replace(/^```/, "").replace(/```$/, "").trim();
    try { arr = JSON.parse(clean); } catch (e2) { return []; }
  }
  if (!Array.isArray(arr)) return [];

  return arr.filter(o => o && o.title && o.url).map((o, i) => ({
    id: meta.id + "_ai_" + i,
    title: o.title,
    url: o.url,
    company: o.company || meta.company,
    source: meta.company,
    location: o.location || "",
    snippet: "",
    date: meta.date,
    emailSubject: meta.subject,
    gmailLink: meta.threadId ? `https://mail.google.com/mail/u/0/#all/${meta.threadId}` : "",
  }));
}

function headerValue(headers, name) {
  const h = (headers || []).find(h => h.name.toLowerCase() === name.toLowerCase());
  return h ? h.value : "";
}

function GmailInbox({ onApply }) {
  const [cfg, setCfg] = useState(getGmailConfig());
  const [connected, setConnected] = useState(false);
  const [tokenClient, setTokenClient] = useState(null);
  const [accessToken, setAccessToken] = useState(null);
  const [emails, setEmails] = useState(() => LocalStore.get("gmail:cache") || []);
  const [dismissed, setDismissed] = useState(() => LocalStore.get("gmail:dismissed") || []);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [editingSenders, setEditingSenders] = useState(false);
  const [sendersDraft, setSendersDraft] = useState(cfg.senders.join("\n"));
  const [editingFilters, setEditingFilters] = useState(false);
  const [scanStats, setScanStats] = useState(null);
  const [progress, setProgress] = useState("");
  const [filtersDraft, setFiltersDraft] = useState(() => {
    const f = getEmailFilters();
    return {
      roleKeywords: f.roleKeywords.join("\n"),
      locationKeywords: f.locationKeywords.join("\n"),
      contractKeywords: f.contractKeywords.join("\n"),
      excludeKeywords: f.excludeKeywords.join("\n"),
    };
  });

  useEffect(() => {
    if (!window.google || !cfg.clientId) return;
    const client = window.google.accounts.oauth2.initTokenClient({
      client_id: cfg.clientId,
      scope: "https://www.googleapis.com/auth/gmail.readonly",
      callback: (resp) => {
        if (resp.error) { setError("Connexion refusée : " + resp.error); return; }
        setAccessToken(resp.access_token);
        setConnected(true);
        setError("");
      },
    });
    setTokenClient(client);
  }, [cfg.clientId]);

  const handleConnect = () => {
    if (!cfg.clientId) { setError("Configure d'abord le Client ID Google dans Réglages."); return; }
    if (!tokenClient) { setError("Client Google pas encore chargé, réessaie dans un instant."); return; }
    tokenClient.requestAccessToken();
  };

  const fetchEmails = async () => {
    if (!accessToken) { setError("Connecte-toi d'abord à Gmail."); return; }
    setLoading(true); setError(""); setScanStats(null); setProgress("");
    try {
      const senderQuery = cfg.senders.filter(Boolean).map(s => `from:${s}`).join(" OR ");
      const subjectQuery = SUBJECT_HINT_KEYWORDS.map(k => `subject:${k.includes(" ") ? `"${k}"` : k}`).join(" OR ");
      const clauses = [];
      if (senderQuery) clauses.push(`(${senderQuery})`);
      if (cfg.broadSearch !== false) clauses.push(`(${subjectQuery})`);
      if (cfg.label) clauses.push(`label:"${cfg.label}"`);
      // in:anywhere = inclut aussi Spam et Corbeille (exclus par defaut sinon)
      const q = `(${clauses.join(" OR ")}) newer_than:30d in:anywhere`;

      // Pagination complete : pas de plafond, on suit nextPageToken tant
      // qu'il y en a un.
      let ids = [];
      let pageToken = null;
      do {
        const url = `https://gmail.googleapis.com/gmail/v1/users/me/messages?q=${encodeURIComponent(q)}&maxResults=500` + (pageToken ? `&pageToken=${pageToken}` : "");
        const listRes = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
        if (!listRes.ok) throw new Error("Gmail API (liste) : HTTP " + listRes.status);
        const listData = await listRes.json();
        ids = ids.concat((listData.messages || []).map(m => m.id));
        pageToken = listData.nextPageToken || null;
        setProgress(`${ids.length} email(s) trouvé(s)...`);
      } while (pageToken);

      // Memoire des emails deja analyses (par ID Gmail, stable dans le
      // temps) : on ne les renvoie JAMAIS a l'IA une deuxieme fois, on
      // reutilise directement le resultat deja calcule. Reduit enormement
      // le volume d'appels Gemini d'un rafraichissement a l'autre.
      const processedCache = LocalStore.get("gmail:processedCache") || {}; // { [emailId]: offers[] }
      const newIds = ids.filter(id => !(id in processedCache));
      const skippedCount = ids.length - newIds.length;

      const filters = getEmailFilters();
      const geminiSettings = LocalStore.get("settings:gemini") || {};
      let allOffers = [];
      let emailsScanned = 0;
      let aiErrors = 0;
      let firstErrorMsg = "";

      // Recupere d'abord les offres deja connues pour les emails non-nouveaux
      ids.forEach(id => {
        if (id in processedCache) allOffers = allOffers.concat(processedCache[id]);
      });

      for (const id of newIds) {
        const msgRes = await fetch(
          `https://gmail.googleapis.com/gmail/v1/users/me/messages/${id}?format=full`,
          { headers: { Authorization: `Bearer ${accessToken}` } }
        );
        if (!msgRes.ok) continue;
        const msg = await msgRes.json();
        emailsScanned++;
        setProgress(`Analyse IA ${emailsScanned}/${newIds.length} (${skippedCount} déjà en cache, ignoré(s))${aiErrors ? ` — ${aiErrors} échec(s)` : ""}...`);
        const headers = msg.payload && msg.payload.headers;
        const subject = headerValue(headers, "Subject");
        const from = headerValue(headers, "From");
        const date = headerValue(headers, "Date");
        const rawBody = extractBodyText(msg.payload);
        const meta = { id: msg.id, threadId: msg.threadId, subject, date, company: from.replace(/<.*>/, "").trim() };

        try {
          const offers = await extractOffersWithAI(rawBody, meta, filters, geminiSettings);
          allOffers = allOffers.concat(offers);
          processedCache[id] = offers; // memorise, meme si vide (= "analyse, rien trouve")
        } catch (e) {
          aiErrors++;
          if (!firstErrorMsg) firstErrorMsg = e.message;
          console.warn("Extraction IA échouée pour un email:", e.message);
          // pas mis en cache : on retentera cet email au prochain rafraichissement
        }

        // Pause proactive entre chaque appel Gemini pour rester sous la
        // limite de requetes/minute du niveau gratuit, plutot que de la
        // heurter systematiquement et devoir tout re-essayer.
        await sleep(1500);
      }

      // Purge du cache : on ne garde que les entrees encore pertinentes
      // (emails presents dans le dernier resultat de recherche), pour ne
      // pas laisser grossir indefiniment le stockage local.
      const idsSet = new Set(ids);
      const prunedCache = {};
      Object.keys(processedCache).forEach(id => { if (idsSet.has(id)) prunedCache[id] = processedCache[id]; });
      LocalStore.set("gmail:processedCache", prunedCache);

      setEmails(allOffers);
      LocalStore.set("gmail:cache", allOffers);
      setScanStats({ emails: emailsScanned, skipped: skippedCount, offers: allOffers.length, aiErrors, firstErrorMsg });
      setProgress("");
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  };

  const dismiss = (id) => {
    const next = [...dismissed, id];
    setDismissed(next);
    LocalStore.set("gmail:dismissed", next);
  };

  const [broadSearch, setBroadSearch] = useState(cfg.broadSearch !== false);
  const [labelDraft, setLabelDraft] = useState(cfg.label || "");

  const saveSenders = () => {
    const senders = sendersDraft.split("\n").map(s => s.trim()).filter(Boolean);
    const next = { ...cfg, senders, broadSearch, label: labelDraft.trim() };
    setCfg(next); setGmailConfig(next); setEditingSenders(false);
  };

  const saveFilters = () => {
    const parsed = {
      roleKeywords: filtersDraft.roleKeywords.split("\n").map(s => s.trim()).filter(Boolean),
      locationKeywords: filtersDraft.locationKeywords.split("\n").map(s => s.trim()).filter(Boolean),
      contractKeywords: filtersDraft.contractKeywords.split("\n").map(s => s.trim()).filter(Boolean),
      excludeKeywords: filtersDraft.excludeKeywords.split("\n").map(s => s.trim()).filter(Boolean),
    };
    setEmailFilters(parsed);
    setEditingFilters(false);
  };

  const visible = emails.filter(e => !dismissed.includes(e.id));

  return (
    <div className="panel">
      <div className="panel-head">
        Offres détectées dans tes emails
        <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
          <button className="btn" onClick={() => { setEditingSenders(v => !v); setEditingFilters(false); }}>Expéditeurs surveillés</button>
          <button className="btn" onClick={() => { setEditingFilters(v => !v); setEditingSenders(false); }}>Critères de filtrage</button>

          ) : (
            <button className="btn" onClick={fetchEmails} disabled={loading}>

          )}

      </div>

      {editingSenders && (
        <div style={{padding: 18, borderBottom: "1px solid var(--line)"}}>
          <div className="form-field">
            <label style={{display:"flex", alignItems:"center", gap:8, cursor:"pointer"}}>
              <input type="checkbox" checked={broadSearch} onChange={e => setBroadSearch(e.target.checked)} style={{width:"auto"}} />
              Recherche élargie (au-delà des expéditeurs connus, par mots-clés de sujet)
            </label>
          </div>
          <div className="form-field" style={{marginTop:10}}>
            <label>Libellé Gmail à inclure en plus (optionnel)</label>

          </div>
          <div className="hint" style={{marginTop:4}}>Tout email portant ce libellé sera inclus, EN PLUS de la recherche élargie — ce n'est pas une restriction, juste un filet de sécurité supplémentaire pour les emails que tu labellises toi-même à la main.</div>
          <div className="form-field" style={{marginTop:10}}>
            <label>Adresses expéditrices à surveiller (une par ligne — optionnel si la recherche élargie est activée)</label>
            <textarea rows={6} value={sendersDraft} onChange={e => setSendersDraft(e.target.value)} style={{fontFamily:"var(--font-mono)", fontSize:12}} />
          </div>
          <div className="hint" style={{marginTop:8}}>Avec la recherche élargie activée, tu n'as plus besoin de connaître ces adresses — l'app cherche tous les emails récents dont le sujet ressemble à une alerte emploi, puis filtre par critères.</div>
          <div className="dl-buttons"><button className="btn primary" onClick={saveSenders}>Enregistrer</button></div>
        </div>
      )}

      {editingFilters && (
        <div style={{padding: 18, borderBottom: "1px solid var(--line)"}}>
          <div className="desc">Une offre n'est retenue que si elle contient au moins un mot-clé de rôle ET un lieu ET un type de contrat, ET aucun mot-clé d'exclusion — exactement la même logique que le scraper.</div>
          <div className="field-grid">
            <div className="form-field"><label>Mots-clés de rôle (1 par ligne)</label><textarea rows={8} value={filtersDraft.roleKeywords} onChange={e => setFiltersDraft({...filtersDraft, roleKeywords: e.target.value})} style={{fontFamily:"var(--font-mono)", fontSize:11.5}} /></div>
            <div className="form-field"><label>Lieux (1 par ligne)</label><textarea rows={8} value={filtersDraft.locationKeywords} onChange={e => setFiltersDraft({...filtersDraft, locationKeywords: e.target.value})} style={{fontFamily:"var(--font-mono)", fontSize:11.5}} /></div>
            <div className="form-field"><label>Type de contrat (1 par ligne)</label><textarea rows={5} value={filtersDraft.contractKeywords} onChange={e => setFiltersDraft({...filtersDraft, contractKeywords: e.target.value})} style={{fontFamily:"var(--font-mono)", fontSize:11.5}} /></div>
            <div className="form-field"><label>Exclusions (1 par ligne)</label><textarea rows={5} value={filtersDraft.excludeKeywords} onChange={e => setFiltersDraft({...filtersDraft, excludeKeywords: e.target.value})} style={{fontFamily:"var(--font-mono)", fontSize:11.5}} /></div>
          </div>
          <div className="dl-buttons"><button className="btn primary" onClick={saveFilters}>Enregistrer les critères</button></div>
        </div>
      )}

      {!cfg.clientId && !editingSenders && !editingFilters && (
        <div className="disabled-note">Configure d'abord ton Client ID Google dans l'onglet Réglages.</div>
      )}

      {error && <div className="error-box">{error}</div>}
      {scanStats && !loading && (
        <div className="hint" style={{padding:"10px 20px 0"}}>
          {scanStats.emails} nouvel(aux) email(s) analysé(s) par l'IA{scanStats.skipped > 0 && ` (+ ${scanStats.skipped} déjà en cache, non ré-analysés)`} → {scanStats.offers} offre(s) au total.
          {scanStats.aiErrors > 0 && ` (${scanStats.aiErrors} email(s) n'ont pas pu être analysés.)`}
          {scanStats.firstErrorMsg && <div style={{color:"var(--ask)", marginTop:4}}>Premier message d'erreur rencontré : {scanStats.firstErrorMsg}</div>}
        </div>
      )}

      {connected && !loading && visible.length === 0 && !error && (
        <div className="empty-state">Aucune offre correspondant à tes critères pour l'instant — clique "Rafraîchir", ou élargis tes critères de filtrage.</div>
      )}

      {visible.length > 0 && (
        <table>
          <thead><tr><th>Poste</th><th>Contexte</th><th>Lieu</th><th>Source</th><th>Date</th><th></th></tr></thead>
          <tbody>
            {visible.map(e => (
              <tr key={e.id}>
                <td className="company-cell">{e.title}</td>
                <td className="role-cell">{e.snippet ? e.snippet.slice(0, 90) + "..." : "—"}</td>
                <td className="role-cell">{e.location || "—"}</td>
                <td className="role-cell">{e.company}</td>
                <td className="role-cell mono-num">{e.date ? new Date(e.date).toLocaleDateString("fr-FR") : "—"}</td>
                <td className="row-actions">
                  {e.url && <button onClick={() => window.open(e.url, "_blank")}>Voir l'offre ↗</button>}
                  {e.gmailLink && <button onClick={() => window.open(e.gmailLink, "_blank")}>Voir l'email ↗</button>}
                  <button onClick={() => onApply(e)}>Postuler</button>
                  <button className="danger" onClick={() => dismiss(e.id)}>Ignorer</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
    </div>
  );
}

/* ============================================================
   ONGLET PROSPECTION — génère des messages courts et personnalisés
   (LinkedIn / email) pour décrocher un call, + suivi des contacts.
   ============================================================ */
function Prospection() {
  const [contacts, setContacts] = useState(() => getContacts());
  const [syncStatus, setSyncStatus] = useState("idle");
  const [expandedId, setExpandedId] = useState(null);
  const [view, setView] = useState("list"); // "list" | "new"
  const shaRef = useRef(null);
  const contactsPath = "contacts.json";

  useEffect(() => {
    (async () => {
      const cfg = GitHubSync.getConfig();
      if (!GitHubSync.isConfigured(cfg)) { setSyncStatus("off"); return; }
      setSyncStatus("busy");
      try {
        const { data, sha } = await GitHubSync.pull(cfg, false, contactsPath);
        shaRef.current = sha;
        if (data) { setContacts(data); saveContactsLocal(data); }
        setSyncStatus("ok");
      } catch (e) { setSyncStatus("err"); }
    })();
  }, []);

  const persist = async (next) => {
    setContacts(next);
    saveContactsLocal(next);
    const cfg = GitHubSync.getConfig();
    if (GitHubSync.isConfigured(cfg)) {
      setSyncStatus("busy");
      try {
        const newSha = await GitHubSync.push(cfg, next, shaRef.current, false, contactsPath);
        shaRef.current = newSha;
        setSyncStatus("ok");
      } catch (e) { setSyncStatus("err"); }
    }
  };

  const addContact = (entry) => persist([{ ...entry, id: Date.now().toString(), dateAdded: new Date().toISOString().slice(0, 10) }, ...contacts]);
  const updateStatus = (id, status) => persist(contacts.map(c => c.id === id ? { ...c, status } : c));
  const deleteContact = (id) => persist(contacts.filter(c => c.id !== id));

  const counts = CONTACT_STATUS_OPTIONS.reduce((acc, s) => { acc[s.value] = 0; return acc; }, {});
  contacts.forEach(c => { counts[c.status] = (counts[c.status] || 0) + 1; });

  if (view === "new") {
    return <NewContact onSave={(entry) => { addContact(entry); setView("list"); }} onCancel={() => setView("list")} />;
  }

  return (
    <React.Fragment>
      <div className="stat-grid">
        <div className="stat-cell"><div className="stat-label">Contacts</div><div className="stat-value">{contacts.length}</div></div>
        <div className="stat-cell"><div className="stat-label">Envoyés</div><div className="stat-value">{counts.envoye || 0}</div></div>
        <div className="stat-cell"><div className="stat-label">Répondus</div><div className="stat-value">{counts.repondu || 0}</div></div>
        <div className="stat-cell"><div className="stat-label">Calls obtenus</div><div className="stat-value bid">{counts.call_obtenu || 0}</div></div>
        <div className="stat-cell"><div className="stat-label">Sans réponse</div><div className="stat-value">{counts.sans_reponse || 0}</div></div>
      </div>
      <div className="panel">
        <div className="panel-head">
          Prospection
          <div style={{display:"flex", alignItems:"center", gap:12}}>
            <span className={"sync-badge " + (syncStatus === "ok" ? "ok" : syncStatus === "err" ? "err" : syncStatus === "busy" ? "busy" : "")}>
              {syncStatus === "off" && "Sync désactivée"}
              {syncStatus === "busy" && "Sync..."}
              {syncStatus === "ok" && "Synchronisé"}
              {syncStatus === "err" && "Erreur sync"}
            </span>
            <button className="btn primary" onClick={() => setView("new")}>+ Nouveau contact</button>
          </div>
        </div>
        {contacts.length === 0 ? (
          <div className="empty-state">Aucun contact pour l'instant. Clique "+ Nouveau contact" pour générer ton premier message.</div>
        ) : (
          <table>
            <thead><tr><th>Nom</th><th>Entreprise</th><th>Canal</th><th>Ajouté le</th><th>Statut</th><th></th></tr></thead>
            <tbody>
              {contacts.map(c => (
                <React.Fragment key={c.id}>
                  <tr onClick={() => setExpandedId(expandedId === c.id ? null : c.id)} style={{cursor:"pointer"}}>
                    <td className="company-cell">{c.name || "—"}</td>
                    <td className="role-cell">{c.company || "—"}</td>
                    <td className="role-cell">{(CHANNEL_OPTIONS.find(ch => ch.value === c.channel) || {}).label || c.channel}</td>
                    <td className="role-cell mono-num">{c.dateAdded}</td>
                    <td onClick={e => e.stopPropagation()}>
                      <select className={"status-select " + contactStatusClass(c.status)} value={c.status} onChange={e => updateStatus(c.id, e.target.value)}>
                        {CONTACT_STATUS_OPTIONS.map(s => <option key={s.value} value={s.value}>{s.label}</option>)}
                      </select>
                    </td>
                    <td className="row-actions" onClick={e => e.stopPropagation()}>
                      {c.linkedinUrl && <button onClick={() => window.open(c.linkedinUrl, "_blank")}>LinkedIn ↗</button>}
                      <button className="danger" onClick={() => { if (confirm("Supprimer ce contact ?")) deleteContact(c.id); }}>Suppr.</button>
                    </td>
                  </tr>
                  {expandedId === c.id && (
                    <tr className="detail-row"><td colSpan={6}>
                      <div className="detail-block">
                        {c.subject && <h4>Objet</h4>}
                        {c.subject && <p>{c.subject}</p>}
                        <h4 style={{marginTop: c.subject ? 14 : 0}}>Message</h4>
                        <p style={{whiteSpace:"pre-wrap"}}>{c.body}</p>
                        <div className="dl-buttons">
                          <button className="btn" onClick={() => { navigator.clipboard.writeText(c.body); }}>Copier le message</button>
                        </div>
                      </div>
                    </td></tr>
                  )}
                </React.Fragment>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </React.Fragment>
  );
}

function NewContact({ onSave, onCancel }) {
  const [name, setName] = useState("");
  const [company, setCompany] = useState("");
  const [role, setRole] = useState("");
  const [linkedinUrl, setLinkedinUrl] = useState("");
  const [channel, setChannel] = useState("linkedin_message");
  const [profileInfo, setProfileInfo] = useState("");
  const [offerText, setOfferText] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [draft, setDraft] = useState(null); // { subject, body }
  const [feedback, setFeedback] = useState("");

  const channelDef = CHANNEL_OPTIONS.find(c => c.value === channel);
  const canGenerate = profileInfo.trim().length >= 20;

  const runGenerate = async (prevDraft, feedbackText) => {
    setError(""); setLoading(true);
    try {
      const geminiSettings = LocalStore.get("settings:gemini") || {};
      const result = await generateOutreachMessage({ channel, name, company, role, profileInfo, offerText }, geminiSettings, prevDraft, feedbackText);
      setDraft(result);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  };

  const handleGenerate = () => runGenerate(null, null);
  const handleRegenerate = () => { if (feedback.trim()) runGenerate(draft, feedback); };

  const handleSave = () => {
    onSave({ name, company, role, linkedinUrl, channel, profileInfo, offerText, subject: draft.subject, body: draft.body, status: "a_envoyer" });
  };

  const charCount = draft ? (draft.body || "").length : 0;
  const overLimit = channelDef.maxChars && charCount > channelDef.maxChars;

  return (
    <div className="panel">
      <div className="panel-head">
        Nouveau message de prospection
        <button className="btn" onClick={onCancel}>← Retour</button>
      </div>
      <div className="form-grid">
        <div className="form-field">
          <label>Nom du contact</label>
          <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="ex. Jean Dupont" />
        </div>
        <div className="form-field">
          <label>Entreprise</label>
          <input type="text" value={company} onChange={e => setCompany(e.target.value)} placeholder="ex. BNP Paribas CIB" />
        </div>
        <div className="form-field">
          <label>Poste actuel</label>
          <input type="text" value={role} onChange={e => setRole(e.target.value)} placeholder="ex. VP Equity Derivatives Sales" />
        </div>
        <div className="form-field">
          <label>Lien LinkedIn (référence uniquement)</label>
          <input type="url" value={linkedinUrl} onChange={e => setLinkedinUrl(e.target.value)} placeholder="https://linkedin.com/in/..." />
        </div>
        <div className="form-field full">
          <label>Canal</label>
          <select value={channel} onChange={e => setChannel(e.target.value)}>
            {CHANNEL_OPTIONS.map(c => <option key={c.value} value={c.value}>{c.label}</option>)}
          </select>
        </div>
        <div className="form-field full">
          <label>Infos du profil (colle ce que tu vois sur LinkedIn — poste, parcours, ce qui t'accroche)</label>
          <textarea rows={5} value={profileInfo} onChange={e => setProfileInfo(e.target.value)} placeholder="ex. VP sur le desk Equity Derivatives depuis 3 ans, ancien Jane Street, a posté récemment sur..." />
        </div>
        <div className="form-field full">
          <label>Offre ou contexte lié (optionnel)</label>
          <textarea rows={3} value={offerText} onChange={e => setOfferText(e.target.value)} placeholder="Colle ici le texte de l'offre si cette prise de contact y est liée..." />
        </div>
      </div>
      {error && <div className="error-box">{error}</div>}
      <div className="form-footer">
        <div className="hint">Le message doit rester court et personnalisé, avec un espace réservé pour que tu proposes toi-même des créneaux.</div>
        <button className="btn primary" disabled={!canGenerate || loading} onClick={handleGenerate}>
          {loading ? <span><span className="spinner"></span>Rédaction...</span> : "Générer le message"}
        </button>
      </div>

      {draft && (
        <div className="preview-wrap">
          {channelDef.value === "email" && (
            <div className="preview-section">
              <h3>Objet</h3>
              <input type="text" value={draft.subject || ""} onChange={e => setDraft({...draft, subject: e.target.value})} />
            </div>
          )}
          <div className="preview-section">
            <h3>Message {channelDef.maxChars && <span style={{color: overLimit ? "var(--ask)" : "var(--amber-faint)", fontWeight: 400, textTransform: "none", letterSpacing: 0}}> — {charCount}/{channelDef.maxChars} caractères{overLimit ? " (dépassement !)" : ""}</span>}</h3>
            <textarea rows={8} value={draft.body || ""} onChange={e => setDraft({...draft, body: e.target.value})} style={{fontFamily:"var(--font-mono)", fontSize:12.5}} />
          </div>

          <div style={{marginTop:10, borderTop:"1px solid var(--line-soft)", paddingTop:12}}>
            <label>Pas satisfait ? Explique pourquoi et régénère</label>
            <textarea rows={2} value={feedback} onChange={e => setFeedback(e.target.value)} placeholder="ex. Trop formel, accroche plus sur son parcours chez..." style={{marginTop:6}} />
            <div className="dl-buttons">
              <button className="btn" disabled={loading || !feedback.trim()} onClick={handleRegenerate}>
                {loading ? <span><span className="spinner"></span>Régénération...</span> : "Régénérer avec ce commentaire"}
              </button>
            </div>
          </div>

          <div className="dl-buttons">
            <button className="btn" onClick={() => navigator.clipboard.writeText(draft.body)}>Copier le message</button>
            <button className="btn primary" onClick={handleSave}>Enregistrer dans le suivi</button>
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [view, setView] = useState("tracker");
  const [applications, setApplications] = useState([]);
  const [loadingApps, setLoadingApps] = useState(true);
  const [expandedId, setExpandedId] = useState(null);
  const [prefill, setPrefill] = useState(null);
  const [syncStatus, setSyncStatus] = useState("idle"); // idle | busy | ok | err | off
  const [syncError, setSyncError] = useState("");
  const shaRef = useRef(null);

  const githubCfg = GitHubSync.getConfig();
  const githubReady = GitHubSync.isConfigured(githubCfg);

  useEffect(() => {
    (async () => {
      const local = LocalStore.get("tracker:applications") || [];
      setApplications(local);
      setLoadingApps(false);

      if (githubReady) {
        setSyncStatus("busy");
        try {
          const { data, sha } = await GitHubSync.pull(githubCfg);
          shaRef.current = sha;
          if (data) {
            setApplications(data);
            LocalStore.set("tracker:applications", data);
          }
          // Recupere aussi le/les CV maitre(s) sauvegardes sur GitHub — sans
          // ca, un appareil qui n'a jamais visite "Mon CV" localement reste
          // bloque sur le template par defaut integre au code (potentiellement
          // perime si un autre appareil a enregistre une version plus recente).
          // Bug reel identifie le 19/08 : deux CV generes le meme jour sur deux
          // appareils differents, avec deux mises en forme differentes.
          for (const [type, ct] of Object.entries(CONTRACT_TYPES)) {
            if (!ct.ready) continue;
            try {
              const fileCfg = { ...githubCfg, path: `cv_master_${type}.tex` };
              const pulled = await GitHubSync.pull(fileCfg, true);
              if (pulled.data) {
                LocalStore.set("cvMaster:" + type, pulled.data);
                LocalStore.set("cvMasterSha:" + type, pulled.sha);
              }
            } catch (e) {
              console.warn(`Sync CV maître (${type}) échouée :`, e.message);
              // non bloquant : on continue avec la version locale/par defaut
            }
          }
          setSyncStatus("ok");
        } catch (e) {
          setSyncStatus("err"); setSyncError(e.message);
        }
      } else {
        setSyncStatus("off");
      }
    })();
  }, []);

  const persist = useCallback(async (next) => {
    setApplications(next);
    LocalStore.set("tracker:applications", next);
    const cfg = GitHubSync.getConfig();
    if (GitHubSync.isConfigured(cfg)) {
      setSyncStatus("busy");
      try {
        const newSha = await GitHubSync.push(cfg, next, shaRef.current);
        shaRef.current = newSha;
        setSyncStatus("ok");
      } catch (e) {
        setSyncStatus("err"); setSyncError(e.message);
      }
    }
  }, []);

  const addApplication = (entry) => persist([{ ...entry, id: Date.now().toString(), dateAdded: new Date().toISOString().slice(0, 10) }, ...applications]);
  const updateStatus = (id, status) => persist(applications.map(a => a.id === id ? { ...a, status } : a));
  const deleteApp = (id) => persist(applications.filter(a => a.id !== id));

  const counts = STATUS_OPTIONS.reduce((acc, s) => { acc[s.value] = 0; return acc; }, {});
  applications.forEach(a => { counts[a.status] = (counts[a.status] || 0) + 1; });

  return (
    <div className="app">
      <TapeTicker applications={applications} />
      <div className="topbar">
        <div>
          <div className="brand-eyebrow">Front Office / Standalone</div>
          <div className="brand-title">Pilot — Candidatures</div>
          <div className="brand-sub">Sacha Laborde · fonctionne hors Claude · données en local {githubReady ? "+ GitHub" : ""} · build {BUILD_VERSION}</div>
        </div>
        <div style={{display:"flex", alignItems:"center", gap:12}}>
          <span className={"sync-badge " + (syncStatus === "ok" ? "ok" : syncStatus === "err" ? "err" : syncStatus === "busy" ? "busy" : "")}>
            {syncStatus === "off" && "Sync GitHub désactivée"}
            {syncStatus === "busy" && "Synchronisation..."}
            {syncStatus === "ok" && "Synchronisé"}
            {syncStatus === "err" && "Erreur de sync"}
            {syncStatus === "idle" && "..."}
          </span>
          <div className="tabs">
            <button className={"tab-btn" + (view === "tracker" ? " active" : "")} onClick={() => setView("tracker")}>Tracker</button>
            <button className={"tab-btn" + (view === "emails" ? " active" : "")} onClick={() => setView("emails")}>Emails</button>
            <button className={"tab-btn" + (view === "new" ? " active" : "")} onClick={() => { setPrefill(null); setView("new"); }}>+ Candidature</button>
            <button className={"tab-btn" + (view === "prospection" ? " active" : "")} onClick={() => setView("prospection")}>Prospection</button>
            <button className={"tab-btn" + (view === "cv" ? " active" : "")} onClick={() => setView("cv")}>Mon CV</button>
            <button className={"tab-btn" + (view === "settings" ? " active" : "")} onClick={() => setView("settings")}>Réglages</button>
          </div>
        </div>
      </div>

      {syncStatus === "err" && <div className="error-box">Sync GitHub : {syncError} — tes données restent sauvegardées en local dans ce navigateur.</div>}

      {view === "tracker" && (
        <Tracker applications={applications} loading={loadingApps} counts={counts} expandedId={expandedId} setExpandedId={setExpandedId} updateStatus={updateStatus} deleteApp={deleteApp} />
      )}
      {view === "emails" && (
        <GmailInbox onApply={(offer) => {
          setPrefill({
            company: offer.company || "",
            jobTitle: offer.title || "",
            location: offer.location || "Paris",
            jobUrl: offer.url || "",
            offerText: offer.snippet || "",
          });
          setView("new");
        }} />
      )}
      {view === "new" && (
        <NewApplication prefill={prefill} onSave={(entry) => { addApplication(entry); setPrefill(null); setView("tracker"); }} />
      )}
      {view === "prospection" && <Prospection />}
      {view === "cv" && <CvEditor />}
      {view === "settings" && <Settings />}
    </div>
  );
}

function Tracker({ applications, loading, counts, expandedId, setExpandedId, updateStatus, deleteApp }) {
  return (
    <React.Fragment>
      <div className="stat-grid">
        <div className="stat-cell"><div className="stat-label">Pipeline total</div><div className="stat-value">{applications.length}</div></div>
        <div className="stat-cell"><div className="stat-label">Envoyées</div><div className="stat-value">{counts.envoyee || 0}</div></div>
        <div className="stat-cell"><div className="stat-label">Entretiens</div><div className="stat-value">{counts.entretien || 0}</div></div>
        <div className="stat-cell"><div className="stat-label">Offres</div><div className="stat-value bid">{counts.offre || 0}</div></div>

                      </select>
                    </td>
                    <td className="row-actions" onClick={e => e.stopPropagation()}>
                      {app.jobUrl && <button onClick={() => window.open(app.jobUrl, "_blank")}>Offre ↗</button>}

                  {expandedId === app.id && <tr className="detail-row"><td colSpan={6}><ApplicationDetail app={app} /></td></tr>}
                </React.Fragment>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </React.Fragment>
  );
}

/* ============================================================
   COMPILATION PDF DIRECTE — via l'API publique latex.ytotech.com
   (LaTeX-on-HTTP, gratuit, open source). Aucune donnée persistée
   côté serveur au-delà de la requête. En cas d'échec, le .tex
   reste toujours téléchargeable en secours (Overleaf).
   ============================================================ */
async function compilePdfViaApi(texSource) {
  const response = await fetch("https://latex.ytotech.com/builds/sync", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      compiler: "pdflatex",
      resources: [{ main: true, content: texSource }],
    }),
  });
  if (!response.ok) {
    let detail = "";
    try {
      const errJson = await response.json();
      detail = errJson.logs || errJson.message || JSON.stringify(errJson).slice(0, 300);
    } catch (e) {
      detail = await response.text().catch(() => "");
    }
    throw new Error(`Échec de compilation (HTTP ${response.status}). ${detail.slice(0, 300)}`);
  }
  return await response.blob();
}

function downloadBlob(filename, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function PdfDownloadButton({ tex, filename, docType }) {
  const [state, setState] = useState("idle"); // idle | busy | err
  const [errMsg, setErrMsg] = useState("");
  const [progressMsg, setProgressMsg] = useState("");

  const handleClick = async () => {
    setState("busy"); setErrMsg(""); setProgressMsg("");
    try {
      const pdfBytes = await compileWithOnePageGuarantee(tex, docType, (level, total) => {
        setProgressMsg(level === 0 ? "Compilation..." : `Ajustement de la mise en page (${level}/${total - 1})...`);
      });
      downloadBinaryFile(filename, pdfBytes, "application/pdf");
      setState("idle");
    } catch (e) {
      setState("err");
      setErrMsg(e.message + " — utilise le bouton .tex ci-contre et Overleaf en secours.");
    }
  };

  return (
    <span>
      <button className="btn primary" onClick={handleClick} disabled={!tex || state === "busy"}>
        {state === "busy" ? <span><span className="spinner"></span>{progressMsg || "Compilation..."}</span> : "Télécharger le PDF"}
      </button>
      {state === "err" && <div className="error-box" style={{margin:"8px 0 0", display:"inline-block"}}>{errMsg}</div>}
    </span>
  );
}

  const ct = CONTRACT_TYPES[contractType];

    setError(""); setLoading(true); setAdaptation(null);

function CvEditor() {
  const [contractType, setContractType] = useState("stage");
  const [cvText, setCvText] = useState(() => getMasterCv("stage") || "");
  const [description, setDescription] = useState("");
  const [mode, setMode] = useState("add"); // "add" | "replace"
  const [targetBullet, setTargetBullet] = useState("");
  const [proposal, setProposal] = useState(null);
  const [feedback, setFeedback] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [saveMsg, setSaveMsg] = useState("");
  const [applyMsg, setApplyMsg] = useState("");
  const [pageCheck, setPageCheck] = useState(null);
  const [checking, setChecking] = useState(false);

  useEffect(() => {
    setCvText(getMasterCv(contractType) || "");
    setProposal(null); setPageCheck(null); setTargetBullet(""); setFeedback("");
  }, [contractType]);

  const ct = CONTRACT_TYPES[contractType];
  const existingBullets = mode === "replace" ? extractCvBullets(cvText) : [];

  const runGenerate = async (prevProposal, feedbackText) => {
    setError(""); setLoading(true); setProposal(null); setApplyMsg("");
    try {
      const geminiSettings = LocalStore.get("settings:gemini") || {};
      const result = await proposeCvAddition(cvText, description, mode, targetBullet, geminiSettings, prevProposal, feedbackText);
      setProposal(result);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  };

  const handlePropose = () => runGenerate(null, null);
  const handleRegenerate = () => { if (feedback.trim()) runGenerate(proposal, feedback); };

  const handleApply = async () => {
    if (!proposal || !proposal._anchorFound) return;
    let newText;
    if (proposal.mode === "replace") {
      newText = cvText.replace(proposal.target, proposal.replacement);
    } else {
      newText = cvText.replace(proposal.insertAfter, proposal.insertAfter + "\n    " + proposal.snippet);
    }
    setCvText(newText);
    setApplyMsg("Appliqué dans le texte ci-dessous — vérifie la mise en page puis enregistre.");
    setProposal(null); setFeedback("");
    setTimeout(() => setApplyMsg(""), 5000);
  };

  const handleCheck = async () => {
    setChecking(true); setPageCheck(null); setError("");
    try {
      const blob = await compilePdfViaApi(cvText);
      const pages = await countPdfPages(blob);
      setPageCheck({ pages, pdfBlob: blob });
    } catch (e) {
      setPageCheck({ error: e.message });
    } finally {
      setChecking(false);
    }
  };

  const handleSave = async () => {
    setSaveMsg("Enregistrement...");
    const result = await saveMasterCv(contractType, cvText);
    setSaveMsg(result.ok ? (result.localOnly ? "Enregistré localement." : "Enregistré (local + GitHub).") : "Erreur de sync : " + result.error);
    setTimeout(() => setSaveMsg(""), 4000);
  };

  const handleReset = () => {
    if (!confirm("Revenir à la version de référence du CV (perdre les modifications non enregistrées) ?")) return;
    setCvText(getDefaultFilledCv(contractType) || "");
  };

  if (!ct.ready) {
    return (
      <div className="panel">
        <div className="panel-head">Mon CV</div>
        <div className="disabled-note">Les templates {ct.label} ne sont pas encore configurés.</div>
      </div>
    );
  }

  const canGenerate = description.trim().length >= 15 && (mode === "add" || targetBullet);

  return (
    <div className="panel">
      <div className="panel-head">
        Mon CV — version de référence
        <select className="status-select" value={contractType} onChange={e => setContractType(e.target.value)}>
          {Object.entries(CONTRACT_TYPES).filter(([,v]) => v.ready).map(([key, v]) => <option key={key} value={key}>{v.label}</option>)}
        </select>
      </div>

      <div className="settings-section">
        <h3>Faire évoluer le CV avec l'IA</h3>
        <div className="desc">Décris ce que tu veux changer. Rien n'est modifié tant que tu n'as pas cliqué "Appliquer" ci-dessous — tu gardes la main à chaque étape.</div>

        <div className="form-grid" style={{padding:0, marginBottom:12}}>
          <div className="form-field">
            <label>Type de changement</label>
            <select value={mode} onChange={e => { setMode(e.target.value); setProposal(null); }}>
              <option value="add">Ajouter (nouvelle expérience / nouvelle ligne)</option>
              <option value="replace">Remplacer un élément existant</option>
            </select>
          </div>
          {mode === "replace" && (
            <div className="form-field">
              <label>Bullet à remplacer</label>
              <select value={targetBullet} onChange={e => setTargetBullet(e.target.value)}>
                <option value="">— Choisis le bullet exact —</option>
                {existingBullets.map((b, i) => <option key={i} value={b}>{b.slice(0, 90)}{b.length > 90 ? "..." : ""}</option>)}
              </select>
            </div>
          )}
        </div>

        <textarea rows={4} value={description} onChange={e => setDescription(e.target.value)} placeholder={mode === "replace" ? "Décris ce qui doit remplacer ce bullet..." : "ex. Stage de 2 mois chez XYZ Capital cet été, j'ai automatisé un reporting quotidien en Python et présenté les résultats à l'équipe trading..."} />
        <div className="dl-buttons">
          <button className="btn primary" disabled={loading || !canGenerate} onClick={handlePropose}>
            {loading ? <span><span className="spinner"></span>Réflexion...</span> : "Proposer"}
          </button>
        </div>
        {error && <div className="error-box" style={{margin:"12px 0 0"}}>{error}</div>}

        {proposal && (
          <div style={{marginTop:14, border:"1px solid var(--line)", padding:14, background:"var(--void)"}}>
            {!proposal._anchorFound && (
              <div className="error-box" style={{marginBottom:10}}>
                L'IA n'a pas retrouvé un ancrage exact dans le CV actuel — application automatique impossible pour cette proposition. Régénère, ou copie le texte ci-dessous à la main.
              </div>
            )}
            {proposal.mode === "replace" ? (
              <React.Fragment>
                <div style={{fontFamily:"var(--font-mono)", fontSize:11, color:"var(--amber)", marginBottom:8}}>Remplacement proposé</div>
                <div className="kw-pair"><div className="kw-old">{proposal.target}</div><div className="kw-new">{proposal.replacement}</div></div>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <div style={{fontFamily:"var(--font-mono)", fontSize:11, color:"var(--amber)", marginBottom:8}}>Section suggérée : {proposal.section}</div>
                <pre style={{whiteSpace:"pre-wrap", fontSize:12, color:"var(--paper-dim)", margin:0}}>{proposal.snippet}</pre>
              </React.Fragment>
            )}
            <div style={{fontSize:11.5, color:"var(--paper-faint)", marginTop:8}}>{proposal.note}</div>

            <div className="dl-buttons">
              {proposal._anchorFound && <button className="btn primary" onClick={handleApply}>Appliquer dans le CV</button>}
              <button className="btn" onClick={() => { navigator.clipboard.writeText(proposal.mode === "replace" ? proposal.replacement : proposal.snippet); setApplyMsg("Copié dans le presse-papier."); setTimeout(()=>setApplyMsg(""),3000); }}>Copier le texte</button>
            </div>

            <div style={{marginTop:14, borderTop:"1px solid var(--line-soft)", paddingTop:12}}>
              <label>Pas satisfait ? Explique pourquoi et régénère</label>
              <textarea rows={2} value={feedback} onChange={e => setFeedback(e.target.value)} placeholder="ex. Trop long, insiste plutôt sur l'aspect quantitatif..." style={{marginTop:6}} />
              <div className="dl-buttons">
                <button className="btn" disabled={loading || !feedback.trim()} onClick={handleRegenerate}>
                  {loading ? <span><span className="spinner"></span>Régénération...</span> : "Régénérer avec ce commentaire"}
                </button>
              </div>
            </div>
          </div>
        )}
        {applyMsg && <div className="copy-note">{applyMsg}</div>}
      </div>

      <div className="settings-section" style={{borderBottom:"none"}}>
        <h3>Code source du CV (édition directe)</h3>
        <div className="desc">Tu peux aussi éditer librement ici. Le jeton <code>__HEADLINE_SENTENCE__</code> doit rester présent quelque part — c'est lui qui est adapté automatiquement à chaque candidature.</div>
        <textarea rows={20} value={cvText} onChange={e => setCvText(e.target.value)} style={{fontFamily:"var(--font-mono)", fontSize:11.5}} />
        <div className="dl-buttons">
          <button className="btn" onClick={handleCheck} disabled={checking}>{checking ? <span><span className="spinner"></span>Compilation...</span> : "Vérifier la mise en page (1 page ?)"}</button>
          <button className="btn" onClick={handleReset}>Revenir à la version de référence</button>
          <button className="btn primary" onClick={handleSave}>Enregistrer comme CV de référence</button>
        </div>
        {pageCheck && !pageCheck.error && (
          <div className={pageCheck.pages === 1 ? "success-box" : "error-box"} style={{margin:"12px 0 0"}}>
            {pageCheck.pages === 1
              ? "✓ Tient bien sur 1 page."
              : `✗ Tient sur ${pageCheck.pages} pages — il faut raccourcir avant d'enregistrer (retire ou condense un bullet).`}
            {" "}
            <button className="btn" style={{marginLeft:8}} onClick={() => downloadBlob("CV_verification.pdf", pageCheck.pdfBlob)}>Voir le PDF</button>
          </div>
        )}
        {pageCheck && pageCheck.error && <div className="error-box" style={{margin:"12px 0 0"}}>Erreur de compilation : {pageCheck.error}</div>}
        {saveMsg && <div className="copy-note">{saveMsg}</div>}
      </div>
    </div>
  );
}

function Settings() {
  const [gemini, setGemini] = useState(() => LocalStore.get("settings:gemini") || { apiKey: "", model: "gemini-2.5-flash" });
  const [github, setGithub] = useState(() => GitHubSync.getConfig());
  const [gmail, setGmail] = useState(() => getGmailConfig());
  const [testMsg, setTestMsg] = useState("");
  const [testing, setTesting] = useState(false);

  const saveGemini = () => { LocalStore.set("settings:gemini", gemini); setTestMsg("Clé Gemini enregistrée localement."); setTimeout(() => setTestMsg(""), 3000); };
  const saveGithub = () => { GitHubSync.setConfig(github); setTestMsg("Config GitHub enregistrée — recharge la page pour synchroniser."); setTimeout(() => setTestMsg(""), 4000); };
  const saveGmail = () => { setGmailConfig(gmail); setTestMsg("Config Gmail enregistrée — va dans l'onglet Emails pour te connecter."); setTimeout(() => setTestMsg(""), 4000); };

  const testGemini = async () => {
    setTesting(true); setTestMsg("");
    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${gemini.model}:generateContent?key=${gemini.apiKey}`, {
        method: "POST", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: "Réponds juste OK" }] }] })
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      setTestMsg("✓ Connexion Gemini réussie.");
    } catch (e) { setTestMsg("✗ Échec : " + e.message); }
    finally { setTesting(false); }
  };

  const testGithub = async () => {
    setTesting(true); setTestMsg("");
    try {
      const res = await fetch(`https://api.github.com/repos/${github.owner}/${github.repo}`, { headers: { Authorization: `Bearer ${github.token}` } });
      if (!res.ok) throw new Error("HTTP " + res.status);
      setTestMsg("✓ Connexion GitHub réussie, repo trouvé.");
    } catch (e) { setTestMsg("✗ Échec : " + e.message); }
    finally { setTesting(false); }
  };

  return (
    <div className="panel">
      <div className="panel-head">Réglages</div>

      <div className="settings-section">
        <h3>Clé API Gemini</h3>
        <div className="desc">Nécessaire pour la génération automatique (accroche, mots-clés, champs de lettre). Stockée uniquement dans ce navigateur, jamais envoyée ailleurs qu'à Google.</div>
        <div className="form-grid" style={{padding:0}}>
          <div className="form-field">
            <label>Clé API</label>
            <input type="password" value={gemini.apiKey} onChange={e => setGemini({...gemini, apiKey: e.target.value})} placeholder="AIza..." />
          </div>
          <div className="form-field">
            <label>Modèle</label>
            <input type="text" value={gemini.model} onChange={e => setGemini({...gemini, model: e.target.value})} placeholder="gemini-2.5-flash" />
          </div>
        </div>
        <div className="dl-buttons">
          <button className="btn primary" onClick={saveGemini}>Enregistrer</button>
          <button className="btn" onClick={testGemini} disabled={testing || !gemini.apiKey}>{testing ? "Test..." : "Tester la connexion"}</button>
        </div>
      </div>

      <div className="settings-section">
        <h3>Synchronisation GitHub (optionnelle)</h3>
        <div className="desc">
          Pour retrouver les mêmes candidatures sur tous tes appareils. Crée un repo GitHub (privé de préférence) et un token d'accès personnel (fine-grained, permission "Contents: Read and write" limitée à ce repo).
        </div>
        <div className="form-grid" style={{padding:0}}>
          <div className="form-field"><label>Token GitHub</label><input type="password" value={github.token} onChange={e => setGithub({...github, token: e.target.value})} placeholder="github_pat_..." /></div>
          <div className="form-field"><label>Propriétaire (username)</label><input type="text" value={github.owner} onChange={e => setGithub({...github, owner: e.target.value})} placeholder="sachalaborde2-cpu" /></div>
          <div className="form-field"><label>Nom du repo</label><input type="text" value={github.repo} onChange={e => setGithub({...github, repo: e.target.value})} placeholder="candidatures-data" /></div>
          <div className="form-field"><label>Chemin du fichier</label><input type="text" value={github.path} onChange={e => setGithub({...github, path: e.target.value})} placeholder="tracker.json" /></div>
        </div>
        <div className="dl-buttons">
          <button className="btn primary" onClick={saveGithub}>Enregistrer</button>
          <button className="btn" onClick={testGithub} disabled={testing || !github.token || !github.owner || !github.repo}>{testing ? "Test..." : "Tester la connexion"}</button>
        </div>
      </div>

      <div className="settings-section" style={{borderBottom:"none"}}>
        <h3>Alertes Gmail (optionnel)</h3>
        <div className="desc">
          Lit tes propres emails d'alerte emploi (lecture seule, jamais d'envoi). Nécessite un Client ID Google — voir les instructions données dans le chat pour le créer via Google Cloud Console.
        </div>
        <div className="form-grid" style={{padding:0}}>
          <div className="form-field full">
            <label>Client ID Google</label>
            <input type="text" value={gmail.clientId} onChange={e => setGmail({...gmail, clientId: e.target.value})} placeholder="xxxxxxxx.apps.googleusercontent.com" />
          </div>
        </div>
        <div className="dl-buttons">
          <button className="btn primary" onClick={saveGmail}>Enregistrer</button>
        </div>
        <div className="hint" style={{marginTop:10}}>Les adresses expéditrices à surveiller se gèrent directement depuis l'onglet "Emails" (bouton "Expéditeurs surveillés").</div>
      </div>

      {testMsg && <div className={testMsg.startsWith("✗") ? "error-box" : "success-box"} style={{margin:"0 20px 20px"}}>{testMsg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
